# DO NOT CHANGE THE NAME (eschool),
#IF YOU WANT TO CHANGE THE APP NAME THEN YOU HAVE TO CHANGE THE EACH IMPORT STATEMENT IN THE CODE
#THIS NAME WILL NOT IMPACT IN YOUR APP, SO ITS NOT MANDATORY TO CHANGE IT
name: eschool
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 3.5.0+39


environment:
  sdk: ">=3.8.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  eschool_core:
    path: ../packages/eschool_core
  eschool_notifications:
    path: ../packages/eschool_notifications
  eschool_people:
    path: ../packages/eschool_people
  eschool_session:
    path: ../packages/eschool_session

  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.4
  google_fonts: ^8.1.0
  dotted_border: ^3.1.0
  table_calendar: ^3.2.0
  dio: ^5.9.2
  lottie: ^3.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  equatable: ^2.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  file_picker: 12.0.0-beta.7
  permission_handler: ^12.0.1
  timeago: ^3.7.1
  firebase_messaging: ^16.2.0
  firebase_core: ^4.7.0
  awesome_notifications: ^0.11.0
  carousel_slider: ^5.1.2
  flutter_html: ^3.0.0
  package_info_plus: ^10.1.0
  flutter_stripe: ^12.6.0
  flutter_tex: 5.3.0
  wakelock_plus: ^1.5.2
  external_path: ^2.2.0
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.5
  readmore: ^3.0.0
  image_picker: ^1.2.2
  any_link_preview: ^3.0.3
  flutter_keyboard_visibility_temp_fork: ^0.1.5
  bloc: any
  intl: any
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0
  youtube_player_iframe: ^6.0.2
  webview_flutter: ^4.13.1
  fl_chart: ^1.2.0

dependency_overrides:
  webview_flutter_plus: 0.4.20


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  change_app_package_name: ^1.5.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/branding/ic_launcher.png"
  adaptive_icon_foreground: "assets/images/branding/ic_launcher_transparent.png"
  adaptive_icon_background: "#241449"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/branding/
    - google_fonts/
    - assets/languages/
    - assets/animations/
 