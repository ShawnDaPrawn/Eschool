paths:
  /consultations/access:
    get:
      operationId: getConsultationAccess
      tags:
      - Consultations
      summary: getConsultationAccess
      description: Fresh current-school account, role and audience authority is checked before data or validation.
        Anonymous answers remain separate from participation and never enter actor-linked receipts/audit. Private
        results are hidden until close; named/text responses require the separate manager reader. Changes use
        private bodies and unknown/query write fields are rejected.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      responses:
        '200':
          description: Authorized private consultation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConsultationAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
