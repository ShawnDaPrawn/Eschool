components:
  schemas:
    ConsultationChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
    ConsultationAudienceChoicePage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - last_page
      - selected_id
      - selected_name
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConsultationChoice'
          maxItems: 25
        page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        selected_id:
          type:
          - integer
          - 'null'
          minimum: 1
        selected_name:
          type:
          - string
          - 'null'
    ConsultationAccess:
      type: object
      additionalProperties: false
      required:
      - school_id
      - account_id
      - session_year_id
      - today
      - timezone
      - writable
      - can_manage
      properties:
        school_id:
          type: integer
          minimum: 1
        account_id:
          type: integer
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
