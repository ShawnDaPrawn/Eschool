components:
  schemas:
    TeachingGroupChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - subject_name
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        subject_name:
          type: string
    TeachingDraftConfiguration:
      type: object
      additionalProperties: false
      required:
      - school_id
      - reader_id
      - today
      - writable
      - groups
      properties:
        school_id:
          type: integer
          minimum: 1
        reader_id:
          type: integer
          minimum: 1
        today:
          type: string
          format: date
        writable:
          type: boolean
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TeachingGroupChoice'
    TeachingEvidenceChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
    TeachingTaskChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - term_id
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        term_id:
          type: integer
          minimum: 1
    TeachingDraftChoices:
      type: object
      additionalProperties: false
      required:
      - school_id
      - reader_id
      - group_id
      - sources
      - topics
      - tasks
      properties:
        school_id:
          type: integer
          minimum: 1
        reader_id:
          type: integer
          minimum: 1
        group_id:
          type: integer
          minimum: 1
        sources:
          type: array
          items:
            $ref: '#/components/schemas/TeachingEvidenceChoice'
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TeachingEvidenceChoice'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TeachingTaskChoice'
    TeachingLearnerChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - approved
      properties:
        id:
          type: integer
          minimum: 1
