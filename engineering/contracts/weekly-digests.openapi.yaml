tags:
- name: WeeklyDigests
  description: Private Monday parent summaries from released school evidence and reviewed language templates.
paths:
  /digests/access:
    get:
      operationId: getWeeklyDigestAccess
      tags:
      - WeeklyDigests
      summary: getWeeklyDigestAccess
      description: Parent-only per-child school evidence, never clinical notes or risk labels. Current account,
        school, guardian relationship and learner source authorize each read and notification delivery. School managers
        review immutable language versions; an unapproved preferred language never silently falls back. Exact mutation
        retries retain their operation identifier.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      responses:
        '200':
          description: Freshly authorized private weekly digest result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyDigestAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '423':
          description: This school module or selected year is read-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digests/preferences:
    post:
      operationId: setWeeklyDigestPreference
      tags:
      - WeeklyDigests
      summary: setWeeklyDigestPreference
      description: Parent-only per-child school evidence, never clinical notes or risk labels. Current account,
        school, guardian relationship and learner source authorize each read and notification delivery. School managers
        review immutable language versions; an unapproved preferred language never silently falls back. Exact mutation
        retries retain their operation identifier.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      responses:
        '200':
          description: Freshly authorized private weekly digest result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyDigestReferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '423':
          description: This school module or selected year is read-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyDigestPreferenceInput'
  /digests/learners/{learner}/weeks:
    get:
      operationId: getWeeklyDigests
      tags:
      - WeeklyDigests
      summary: getWeeklyDigests
      description: Parent-only per-child school evidence, never clinical notes or risk labels. Current account,
        school, guardian relationship and learner source authorize each read and notification delivery. School managers
        review immutable language versions; an unapproved preferred language never silently falls back. Exact mutation
        retries retain their operation identifier.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: learner
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: before
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Freshly authorized private weekly digest result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyDigestPageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '423':
          description: This school module or selected year is read-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digests/{digest}:
    get:
      operationId: getWeeklyDigest
      tags:
      - WeeklyDigests
      summary: getWeeklyDigest
      description: Parent-only per-child school evidence, never clinical notes or risk labels. Current account,
        school, guardian relationship and learner source authorize each read and notification delivery. School managers
        review immutable language versions; an unapproved preferred language never silently falls back. Exact mutation
        retries retain their operation identifier.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: digest
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Freshly authorized private weekly digest result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyDigestDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '423':
          description: This school module or selected year is read-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digests/templates:
    get:
      operationId: getWeeklyDigestTemplates
      tags:
