      responses:
        '200':
          description: Freshly authorized private weekly digest result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyDigestReferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
