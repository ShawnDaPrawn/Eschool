tags:
- name: PeerTutoring
  description: Supervised mastery-topic matching, private arrangements and append-only service minutes.
paths:
  /peer-tutoring/configuration:
    get:
      operationId: getPeerConfiguration
      tags:
      - PeerTutoring
      summary: getPeerConfiguration
      description: Fresh school/account and explicit known app-purpose/persona checks apply to reads and exact operation
        replays. Staff need their current academic group scope; families read only their own approved current learner
        arrangements. Matching never exposes a partner mastery record. Confirmed attendance appends integer minutes;
        optional points use the real category, placement, cap and reversal authority atomically. No mastery, mark
        or permanent-profile points are fabricated.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: persona
        in: query
        required: true
        schema:
          type: string
          enum:
          - staff
          - parent
          - student
      responses:
        '200':
          description: Freshly authorised private peer-tutoring result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
