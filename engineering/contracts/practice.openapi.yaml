tags:
- name: Practice
  description: Approved daily self-study, review memory and separate practice evidence.
paths:
  /learning/practice/access:
    get:
      operationId: getPracticeAccess
      tags:
      - Practice
      summary: getPracticeAccess
      description: Approved school-content practice only, never official assessment marks. Fresh learner approval/ownership
        or dated Teacher allocation and all published topic/content sources authorize before reads, writes and encrypted
        receipt replay. The module defaults off. Approved answers are deliberately included for offline self-study.
        Writes accept body fields only; an unknown outcome retries the same operation. Offline synchronization uses
        the server school calendar day.
      parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: Freshly scoped private practice result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPracticeAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '423':
          description: Historical school year is read-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
