tags:
- name: FamilyVisits
  description: Private parent meeting bookings and staff-approved online early collection.
paths:
  /family-visits/configuration:
    get:
      operationId: getFamilyVisitConfiguration
      tags:
      - FamilyVisits
      summary: getFamilyVisitConfiguration
      description: Private fresh school/account/guardian or named staff authority. Wall-clock writes use the school
        timezone and reject ambiguous DST instants. Exact operation UUID/body retries return their original receipt
        only after fresh authorisation. Gate collection requires a current delegated reader, matching recent online
        learner-card scan, staff approval and explicit collector check. No offline collection approval.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      responses:
        '200':
          description: Freshly authorised private visit result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyVisitConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
