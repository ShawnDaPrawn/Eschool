components:
  schemas:
    FamilyVisitChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
    FamilyVisitRules:
      type: object
      additionalProperties: false
      required:
      - max_window_minutes
      - max_future_days
      - scan_max_age_seconds
      - revision
      - staff_approval_required
      - collector_check_required
      properties:
        max_window_minutes:
          type: integer
          minimum: 15
          maximum: 240
        max_future_days:
          type: integer
          minimum: 1
          maximum: 30
        scan_max_age_seconds:
          type: integer
          minimum: 15
          maximum: 120
        revision:
          type: integer
          minimum: 0
        staff_approval_required:
          type: boolean
        collector_check_required:
          type: boolean
        id:
          type: string
          format: uuid
    FamilyVisitConfiguration:
      type: object
      additionalProperties: false
      required:
      - school_id
      - reader_id
      - timezone
      - writable
      - can_manage
      - can_host
      - children
      - hosts
      - gate_rules
      properties:
        school_id:
          type: integer
          minimum: 1
        reader_id:
          type: integer
          minimum: 1
        timezone:
          type: string
        writable:
          type: boolean
        can_manage:
          type: boolean
        can_host:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/FamilyVisitChoice'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/FamilyVisitChoice'
        gate_rules:
          $ref: '#/components/schemas/FamilyVisitRules'
    FamilyMeetingSlot:
      type: object
      additionalProperties: false
      required:
      - id
      - host_id
      - host_name
      - title
      - venue
      - starts_at
      - ends_at
      - booking_closes_at
      - status
      - revision
      properties:
        id:
          type: string
          format: uuid
        host_id:
          type: integer
          minimum: 1
        host_name:
          type: string
        title:
          type: string
        venue:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        booking_closes_at:
          type: string
          format: date-time
        status:
          type: string
          pattern: ^(open|booked|cancelled)$
        revision:
          type: integer
          minimum: 1
        learner_id:
          type:
          - integer
          - 'null'
          minimum: 1
        learner_name:
          type:
          - string
          - 'null'
        guardian_user_id:
          type:
          - integer
          - 'null'
          minimum: 1
    FamilyMeetingPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FamilyMeetingSlot'
        next_page:
          type:
          - integer
          - 'null'
          minimum: 1
    FamilyVisitCancelled:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - revision
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          pattern: ^(open|cancelled)$
        revision:
          type: integer
          minimum: 1
    FamilyGatePass:
      type: object
      additionalProperties: false
      required:
      - id
      - learner_id
      - requested_by
      - approved_by
      - collector
      - reason
      - starts_at
      - ends_at
      - status
      - revision
      - collected_at
      properties:
        id:
          type: string
          format: uuid
        learner_id:
          type: integer
          minimum: 1
        requested_by:
          type: integer
          minimum: 1
        approved_by:
          type:
          - integer
          - 'null'
          minimum: 1
        collector:
          type: string
        reason:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          pattern: ^(pending|approved|cancelled|collected)$
        revision:
          type: integer
          minimum: 1
        collected_at:
          type:
          - string
          - 'null'
          format: date-time
        learner_name:
          type: string
    FamilyGatePassPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FamilyGatePass'
        next_page:
          type:
          - integer
          - 'null'
          minimum: 1
    FamilyGateClearance:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - collector
      - starts_at
      - ends_at
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        collector:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    FamilyGateLookup:
      type: object
      additionalProperties: false
      required:
      - scan_id
      - learner_id
      - learner_name
      - passes
      - collector_check_required
      - available
      properties:
        available:
          type: boolean
        scan_id:
          type: string
          format: uuid
        learner_id:
          type: integer
          minimum: 1
        learner_name:
          type: string
        passes:
          type: array
          items:
            $ref: '#/components/schemas/FamilyGateClearance'
        collector_check_required:
          type: boolean
    FamilyGateCollected:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - revision
      - collected_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          pattern: ^collected$
        revision:
          type: integer
          minimum: 1
        collected_at:
          type: string
          format: date-time
    FamilyMeetingCreate:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - host_id
      - title
      - venue
      - starts_at
      - ends_at
