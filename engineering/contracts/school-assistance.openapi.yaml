components:
  schemas:
    SchoolAssistanceConfiguration:
      type: object
      additionalProperties: false
      required:
      - can_parent
      - can_office
      - languages
      - answer_available
      - translation_available
      - school_id
      - reader_id
      properties:
        can_parent: &id001
          type: boolean
        can_office: *id001
        languages:
          type: array
          items:
            type: string
            maxLength: 16
          maxItems: 30
        answer_available: *id001
        translation_available: *id001
        school_id: &id002
          type: integer
          minimum: 1
        reader_id: *id002
    SchoolAssistanceDocument:
      type: object
      additionalProperties: false
      required:
      - id
      - document_key
      - revision
      - title
      - source_reference
      - expires_on
      - state
      properties:
        id: &id003
          type: string
          format: uuid
        document_key: *id003
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 191
        source_reference:
          type: string
          maxLength: 2048
        expires_on:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
        state:
          type: string
          enum:
          - published
          - withdrawn
    SchoolAssistanceDocumentBody:
      type: object
      additionalProperties: false
      required:
      - id
      - document_key
      - revision
      - title
      - source_reference
      - expires_on
      - state
      - markdown
      - school_id
      - reader_id
      properties:
        id: &id004
          type: string
          format: uuid
        document_key: *id004
        revision: &id005
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 191
        source_reference:
          type: string
          maxLength: 2048
        expires_on:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
        state:
          type: string
          enum:
          - published
          - withdrawn
        markdown:
          type: string
          maxLength: 32000
        school_id: *id005
        reader_id: *id005
    SchoolAssistanceDocumentResult:
      type: object
      additionalProperties: false
      required:
      - id
      - document_key
      - revision
      - title
      - source_reference
      - expires_on
      - state
      - school_id
      - reader_id
      properties:
        id: &id006
          type: string
          format: uuid
        document_key: *id006
        revision: &id007
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 191
        source_reference:
          type: string
          maxLength: 2048
        expires_on:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
        state:
          type: string
          enum:
          - published
          - withdrawn
        school_id: *id007
        reader_id: *id007
    SchoolAssistanceDocumentPage:
      type: object
      additionalProperties: false
      required:
      - page
      - last_page
      - items
      - school_id
      - reader_id
      properties:
        page: &id008
          type: integer
          minimum: 1
        last_page: *id008
        items:
          type: array
          items:
            $ref: '#/components/schemas/SchoolAssistanceDocument'
          maxItems: 20
        school_id: *id008
        reader_id: *id008
    SchoolAssistanceThreadMetadata:
      type: object
