          type: string
          maxLength: 1000
        school_id: *id014
        reader_id: *id014
    SchoolAssistanceSourceLocator:
      type: object
      additionalProperties: false
      required: []
      properties:
        id:
          type: string
          format: uuid
        year:
          type: integer
          minimum: 1
        term_id:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        on_date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
    SchoolAssistanceCitation:
      type: object
      additionalProperties: false
      required:
      - token
      - kind
      - title
      - locator
      properties:
        token:
          type: string
          pattern: ^s[1-9][0-9]*$
        kind:
          type: string
          enum:
          - document
          - calendar
          - released_marks
          - attendance
          - support_message
        title:
          type: string
        locator:
          $ref: '#/components/schemas/SchoolAssistanceSourceLocator'
    SchoolAssistanceAnswer:
      type: object
      additionalProperties: false
      required:
      - language
      - text
      - citations
      - handoff
      properties:
        language:
          type: string
          maxLength: 16
        text:
          type: string
          maxLength: 4000
        citations:
          type: array
          items:
            type: string
            pattern: ^s[1-9][0-9]*$
          maxItems: 20
        handoff:
          type: boolean
    SchoolAssistanceTurn:
      type: object
      additionalProperties: false
      required:
      - id
      - purpose
      - state
      - learner_id
      - expires_at
      - language
      - review_text
      - citations
      - response
      - school_id
      - reader_id
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
          - answer
          - translation
        state:
          type: string
          enum:
          - prepared
          - completed
        learner_id: &id015
