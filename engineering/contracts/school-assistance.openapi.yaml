        identifiers_reviewed:
          type: boolean
          description: 'Must be true: human-approved school publication and identifiers review.'
        expires_on:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
