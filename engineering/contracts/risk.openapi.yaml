  /growth/risk/interventions/{intervention}/owner:
    post:
      operationId: transferInterventionOwner
      tags:
      - Growth
      summary: transferInterventionOwner
      description: Staff-only early warning. Fresh school, role, dated allocation, separate risk caseload
        and original owner authority precede body retrieval or replay. Platform identities and impersonation
        are denied. Signals are guidance, never diagnosis or family labels. Unknown sources remain null.
        Private writes are body-only and require a stable operation_id UUID; encrypted receipts use keyed
        intent hashes. Every response forbids caching. New cases require the current year; retained owned
        actions preserve their reporting year.
      parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
      - $ref: '#/components/parameters/SchoolId'
      - name: intervention
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Fresh authorized private risk metadata or owned intervention.
          content:
            application/json:
              schema:
