      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: page
        in: query
        schema: &id001
          type: integer
          minimum: 1
      responses:
        '200':
          description: Private scoped support data; never cached.
