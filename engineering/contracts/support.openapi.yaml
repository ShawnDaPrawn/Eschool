  /pastoral/support/access:
    get:
      operationId: getSupportAccess
      tags:
      - Pastoral
      summary: getSupportAccess
      description: Fresh school, module, role and explicit dated caseload checks precede validation and UUID
        replay. Principals manage assignment metadata only. Teachers receive only named approved expiring accommodation
        projections, without clinical plan bodies. Writes require an operation_id UUID and current revision;
