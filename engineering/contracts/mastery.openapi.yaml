tags:
- name: Growth
  description: Private learner growth, mastery and supported practice.
paths:
  /growth/mastery/configuration:
    get:
      operationId: getMasteryConfiguration
      tags:
      - Growth
      summary: getMasteryConfiguration
      description: Fresh module, school, role and own-learner authority is checked before validation and idempotent
        replay. Family mark-derived mastery requires explicit school opt-in and immutable released question evidence;
        raw captured marks never populate family results. Unknown evidence is null, not zero. Published topic and
        exact assessment-term references only.
      parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
      - $ref: '#/components/parameters/SchoolId'
      - name: session_year_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Private school-scoped mastery response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasteryConfigurationResponse'
        '400':
          $ref: '#/components/responses/IdempotencyKeyProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
