          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyHealthWrite'
components:
  schemas:
    FamilyFormChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - person_id
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        person_id:
          type: integer
          minimum: 1
    FamilyFormGroupChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - session_year_id
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        session_year_id:
          type: integer
          minimum: 1
    FamilyFormConfiguration:
      type: object
      additionalProperties: false
      required:
      - children
      - groups
      - writable
      - signature_name
      - timezone
      - session_year_id
      - school_id
      - reader_id
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/FamilyFormChoice'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/FamilyFormGroupChoice'
        writable:
          type: boolean
        signature_name:
          type: string
        timezone:
          type: string
        session_year_id:
          type: integer
          minimum: 1
        school_id:
          type: integer
          minimum: 1
        reader_id:
          type: integer
          minimum: 1
    FamilyConsentSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - activity_group_id
      - session_year_id
      - status
      - event_starts_at
      - event_ends_at
      - respond_by
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        activity_group_id:
          type: integer
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        status:
          type: string
          pattern: ^(open|cancelled)$
        event_starts_at:
          type: string
          format: date-time
        event_ends_at:
          type: string
          format: date-time
        respond_by:
          type: string
          format: date-time
    FamilyConsentPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FamilyConsentSummary'
        next_page:
          type:
          - integer
          - 'null'
          minimum: 1
    FamilyConsentDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - status
      - event_starts_at
      - event_ends_at
      - respond_by
      - learner_id
      - wording
      - fingerprint
      - revision
      - decision
      - signed_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          pattern: ^(open|cancelled)$
        event_starts_at:
          type: string
          format: date-time
        event_ends_at:
          type: string
          format: date-time
        respond_by:
          type: string
          format: date-time
        learner_id:
          type: integer
          minimum: 1
        wording:
          type: string
        fingerprint:
          type: string
          minLength: 64
          maxLength: 64
        revision:
          type: integer
          minimum: 0
        decision:
          type:
          - string
          - 'null'
          pattern: ^(yes|no)$
        signed_at:
          type:
          - string
          - 'null'
          format: date-time
    FamilyConsentManagedRecipient:
      type: object
      additionalProperties: false
      required:
      - learner_id
      - name
      - current
      - revision
      - decision
      - signed_at
      - effective
      properties:
        learner_id:
          type: integer
          minimum: 1
        name:
          type: string
        current:
          type: boolean
        revision:
          type: integer
          minimum: 0
        decision:
          type:
          - string
          - 'null'
          pattern: ^(yes|no)$
        signed_at:
          type:
          - string
          - 'null'
          format: date-time
        effective:
          type: boolean
    FamilyConsentManaged:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - activity_group_id
      - session_year_id
      - status
      - event_starts_at
      - event_ends_at
      - respond_by
      - wording
      - fingerprint
      - revision
      - recipients
      - next_page
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        activity_group_id:
          type: integer
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        status:
          type: string
          pattern: ^(open|cancelled)$
        event_starts_at:
          type: string
          format: date-time
        event_ends_at:
          type: string
          format: date-time
        respond_by:
          type: string
          format: date-time
        wording:
          type: string
        fingerprint:
          type: string
          minLength: 64
          maxLength: 64
        revision:
          type: integer
          minimum: 1
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/FamilyConsentManagedRecipient'
        next_page:
          type:
          - integer
          - 'null'
          minimum: 1
    FamilyConsentCreate:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - activity_group_id
      - title
      - wording
      - event_starts_at
      - event_ends_at
      - respond_by
      - learner_ids
      properties:
        operation_id:
          type: string
          format: uuid
        activity_group_id:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 191
        wording:
          type: string
          maxLength: 20000
        event_starts_at:
          type: string
          format: date-time
        event_ends_at:
          type: string
          format: date-time
        respond_by:
          type: string
          format: date-time
        learner_ids:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
          maxItems: 500
          uniqueItems: true
    FamilyConsentCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - fingerprint
      - revision
      properties:
        id:
          type: string
          format: uuid
        fingerprint:
          type: string
          minLength: 64
          maxLength: 64
        revision:
          type: integer
          minimum: 1
    FamilyConsentSign:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - revision
      - fingerprint
      - decision
      - acknowledged
      - signed_name
      properties:
        operation_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        fingerprint:
          type: string
          minLength: 64
          maxLength: 64
        decision:
          type: string
          pattern: ^(yes|no)$
        acknowledged:
          type: boolean
          description: Must be true to attest that the exact consent wording was read.
        signed_name:
          type: string
          maxLength: 191
    FamilyConsentSigned:
      type: object
      additionalProperties: false
      required:
      - id
      - request_id
      - learner_id
      - decision
      - revision
      - signed_at
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        learner_id:
          type: integer
          minimum: 1
        decision:
          type: string
          pattern: ^(yes|no)$
        revision:
          type: integer
          minimum: 1
        signed_at:
          type: string
          format: date-time
    FamilyConsentCancel:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - revision
      properties:
        operation_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
    FamilyConsentCancelled:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - revision
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          pattern: ^cancelled$
        revision:
          type: integer
          minimum: 1
    FamilyHealthValue:
      type: object
      additionalProperties: false
      required: []
      properties:
        text:
          type: string
          maxLength: 10000
        choices:
          type: array
          items:
            type: string
            maxLength: 512
          maxItems: 100
        flag:
          type: boolean
        clear:
          type: boolean
          description: True explicitly clears an optional health field.
      minProperties: 1
      maxProperties: 1
    FamilyHealthWrite:
      type: object
      additionalProperties: false
      required:
      - values
      properties:
        values:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FamilyHealthValue'
          minProperties: 1
          maxProperties: 100
    FamilyFormConfigurationResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/FamilyFormConfiguration'
        code:
          type: integer
          enum:
          - 200
    FamilyConsentPageResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/FamilyConsentPage'
        code:
          type: integer
          enum:
          - 200
    FamilyConsentCreatedResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/FamilyConsentCreated'
        code:
          type: integer
          enum:
          - 200
    FamilyConsentDetailResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/FamilyConsentDetail'
        code:
          type: integer
          enum:
          - 200
    FamilyConsentManagedResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/FamilyConsentManaged'
        code:
          type: integer
          enum:
          - 200
    FamilyConsentCancelledResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/FamilyConsentCancelled'
        code:
          type: integer
          enum:
          - 200
    FamilyConsentSignedResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/FamilyConsentSigned'
        code:
          type: integer
          enum:
          - 200
