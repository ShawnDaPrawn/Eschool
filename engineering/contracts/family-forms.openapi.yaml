tags:
- name: FamilyForms
  description: Private health categories and activity/trip consent with authenticated guardian attestations.
paths:
  /family-forms/configuration:
    get:
      operationId: getFamilyFormConfiguration
      tags:
      - FamilyForms
      summary: getFamilyFormConfiguration
      description: Fresh school/guardian/group authority is checked before private records or operation replay.
        Consents bind exact text and audience; a retained yes record is not operational authority. Medical values
        never enter consent or meeting data.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      responses:
        '200':
          description: Freshly authorized private family result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyFormConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /family-forms/consents:
    get:
      operationId: getFamilyConsents
      tags:
      - FamilyForms
      summary: getFamilyConsents
      description: Fresh school/guardian/group authority is checked before private records or operation replay.
        Consents bind exact text and audience; a retained yes record is not operational authority. Medical values
        never enter consent or meeting data.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: learner_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: activity_group_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100000
      responses:
        '200':
          description: Freshly authorized private family result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyConsentPageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createFamilyConsent
      tags:
      - FamilyForms
      summary: createFamilyConsent
      description: Fresh school/guardian/group authority is checked before private records or operation replay.
        Consents bind exact text and audience; a retained yes record is not operational authority. Medical values
        never enter consent or meeting data.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      responses:
        '200':
          description: Freshly authorized private family result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyConsentCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyConsentCreate'
  /family-forms/consents/{consent}:
    get:
      operationId: getFamilyConsent
      tags:
      - FamilyForms
      summary: getFamilyConsent
      description: Fresh school/guardian/group authority is checked before private records or operation replay.
        Consents bind exact text and audience; a retained yes record is not operational authority. Medical values
        never enter consent or meeting data.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: consent
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: learner_id
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Freshly authorized private family result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyConsentDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /family-forms/consents/{consent}/managed:
    get:
      operationId: getManagedFamilyConsent
      tags:
      - FamilyForms
      summary: getManagedFamilyConsent
      description: Fresh school/guardian/group authority is checked before private records or operation replay.
        Consents bind exact text and audience; a retained yes record is not operational authority. Medical values
        never enter consent or meeting data.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: consent
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100000
      responses:
        '200':
          description: Freshly authorized private family result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyConsentManagedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /family-forms/consents/{consent}/cancel:
    post:
      operationId: cancelFamilyConsent
      tags:
      - FamilyForms
      summary: cancelFamilyConsent
      description: Fresh school/guardian/group authority is checked before private records or operation replay.
        Consents bind exact text and audience; a retained yes record is not operational authority. Medical values
        never enter consent or meeting data.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: consent
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Freshly authorized private family result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyConsentCancelledResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyConsentCancel'
  /family-forms/consents/{consent}/learners/{learner}/response:
    post:
      operationId: signFamilyConsent
      tags:
      - FamilyForms
      summary: signFamilyConsent
      description: Fresh school/guardian/group authority is checked before private records or operation replay.
        Consents bind exact text and audience; a retained yes record is not operational authority. Medical values
        never enter consent or meeting data.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: consent
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: learner
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Freshly authorized private family result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyConsentSignedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyConsentSign'
  /family-forms/learners/{learner}/health:
    get:
      operationId: getFamilyHealthForm
      tags:
      - FamilyForms
      summary: getFamilyHealthForm
      description: Fresh school/guardian/group authority is checked before private records or operation replay.
        Consents bind exact text and audience; a retained yes record is not operational authority. Medical values
        never enter consent or meeting data.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: learner
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Freshly authorized private family result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileFormResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: saveFamilyHealthForm
      tags:
      - FamilyForms
      summary: saveFamilyHealthForm
      description: Fresh school/guardian/group authority is checked before private records or operation replay.
        Consents bind exact text and audience; a retained yes record is not operational authority. Medical values
        never enter consent or meeting data.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: learner
        in: path
        required: true
        schema:
