        caches. Archived source marks remain historical and learner approval remains separate.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - learners
          - destinations
          - guardians
          - reports
          - documents
          - years
          - rooms
          - categories
      - name: search
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          maxLength: 100
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: learner_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: guardian_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: selected
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: Authorized private school transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferChoicePageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
