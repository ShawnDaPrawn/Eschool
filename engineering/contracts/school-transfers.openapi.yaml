tags:
- name: SchoolTransfers
  description: Signed consented academic history and atomic enrolment handoffs.
paths:
  /transfers/access:
    get:
      operationId: getTransferAccess
      tags:
      - SchoolTransfers
      summary: getTransferAccess
      description: Fresh school and account authority precedes validation and exact operation replay. Only school
        administrators and principals manage packages; the named verified guardian consents to the fingerprint and
        destination. Receiving acceptance is atomic. Private writes use bodies; no private HTTP receipts or shared
        caches. Archived source marks remain historical and learner approval remains separate.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      responses:
        '200':
          description: Authorized private school transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /transfers/choices/{kind}:
