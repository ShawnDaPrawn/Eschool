paths:
  /activities/chat-policy:
    get:
      operationId: getGroupChatPolicy
      tags:
      - Activities
      summary: Read the school role-pair conversation policy
      description: Fresh school/account and explicit app-purpose/persona checks apply to every call, replay and
        source read. Allocated staff supervise their own groups; families need current approved learner membership
        and enrolment. Private ownership binds both account and persona. Titles and bodies never appear in metadata
        receipts; a missing receipt is an unconfirmed outcome, not authorization to automatically repeat a discarded
        draft with a new UUID.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      responses:
        '200':
          description: Read the school role-pair conversation policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChatPolicyResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '423':
          description: Conversation writes are unavailable in a readonly or historical context. Authorized moderation
            and reads remain available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: setGroupChatPolicy
      tags:
      - Activities
      summary: Update school role-pair policy without granting conversation access
      description: Fresh school/account and explicit app-purpose/persona checks apply to every call, replay and
        source read. Allocated staff supervise their own groups; families need current approved learner membership
        and enrolment. Private ownership binds both account and persona. Titles and bodies never appear in metadata
        receipts; a missing receipt is an unconfirmed outcome, not authorization to automatically repeat a discarded
        draft with a new UUID.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      responses:
        '200':
          description: Update school role-pair policy without granting conversation access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChatPolicyResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '423':
          description: Conversation writes are unavailable in a readonly or historical context. Authorized moderation
            and reads remain available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupChatPolicyChange'
