components:
  schemas:
    GroupChatPersona:
      type: string
      enum:
      - staff
      - parent
      - student
    GroupChatAudience:
      type: string
      enum:
      - learners
      - guardians
      - staff
    GroupChatVisibility:
      type: string
      enum:
      - thread
      - staff
    GroupChatThreadKind:
      type: string
      enum:
      - announcement
      - question
    GroupChatOperationType:
      type: string
      enum:
      - thread_created
      - thread_state
      - message_sent
      - message_removed
    GroupChatPolicy:
      type: object
      additionalProperties: false
      required:
      - revision
      - staff_learners
      - staff_guardians
      - staff_staff
      - learner_shared_replies
      - guardian_shared_replies
      properties:
        revision:
          type: integer
          minimum: 0
        staff_learners:
          type: boolean
        staff_guardians:
          type: boolean
        staff_staff:
          type: boolean
        learner_shared_replies:
          type: boolean
        guardian_shared_replies:
          type: boolean
    GroupChatThread:
      type: object
      additionalProperties: false
      required:
      - id
      - activity_group_id
      - title
      - audience
      - private
      - closed
      - revision
      - last_message_at
      properties:
        id:
          type: string
          format: uuid
        activity_group_id:
          type: integer
          minimum: 1
        title:
          type:
          - string
          - 'null'
          maxLength: 191
        audience:
          $ref: '#/components/schemas/GroupChatAudience'
        private:
          type: boolean
        closed:
          type: boolean
        revision:
          type: integer
          minimum: 1
        last_message_at:
          type: string
          format: date-time
    GroupChatThreadSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - activity_group_id
      - title
      - audience
      - private
      - closed
      - revision
      - last_message_at
      - unread
      properties:
        id:
          type: string
          format: uuid
        activity_group_id:
          type: integer
          minimum: 1
        title:
          type:
          - string
          - 'null'
          maxLength: 191
        audience:
          $ref: '#/components/schemas/GroupChatAudience'
        private:
          type: boolean
        closed:
          type: boolean
        revision:
          type: integer
          minimum: 1
        last_message_at:
          type: string
          format: date-time
        unread:
          type: integer
          minimum: 0
    GroupChatThreadPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_before
      - policy
      - persona
      - writable
      - max_characters
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupChatThreadSummary'
          maxItems: 25
        next_before:
          type:
          - string
          - 'null'
          format: uuid
        policy:
          $ref: '#/components/schemas/GroupChatPolicy'
        persona:
          $ref: '#/components/schemas/GroupChatPersona'
        writable:
          type: boolean
        max_characters:
          type: integer
          minimum: 1
          maximum: 10000
    GroupChatMessage:
      type: object
      additionalProperties: false
      required:
      - id
      - sender_id
      - sender_name
      - sender_persona
      - body
      - language
      - revision
      - reply_to
      - private
      - removed
      - can_remove
      - sent_at
      properties:
        id:
          type: integer
          minimum: 1
        sender_id:
          type: integer
          minimum: 1
        sender_name:
          type: string
        sender_persona:
          $ref: '#/components/schemas/GroupChatPersona'
        body:
          type:
          - string
          - 'null'
          maxLength: 10000
        language:
          type: string
          maxLength: 20
        revision:
          type: integer
          minimum: 1
        reply_to:
          type:
          - integer
          - 'null'
          minimum: 1
        private:
          type: boolean
        removed:
          type: boolean
        can_remove:
          type: boolean
        sent_at:
          type: string
          format: date-time
    GroupChatConversation:
      type: object
      additionalProperties: false
      required:
      - thread
      - items
      - next_before
      - can_close
      - can_post
      - can_reopen
      - max_characters
      - policy
      properties:
        thread:
          $ref: '#/components/schemas/GroupChatThread'
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupChatMessage'
          maxItems: 50
        next_before:
          type:
          - integer
          - 'null'
          minimum: 1
        can_close:
          type: boolean
        can_post:
          type: boolean
        can_reopen:
          type: boolean
        max_characters:
          type: integer
          minimum: 1
          maximum: 10000
        policy:
          $ref: '#/components/schemas/GroupChatPolicy'
    GroupChatMutation:
      type: object
      additionalProperties: false
      required:
      - operation_type
      - persona
      - thread_id
      - activity_group_id
      - revision
      properties:
        operation_type:
          $ref: '#/components/schemas/GroupChatOperationType'
        persona:
          $ref: '#/components/schemas/GroupChatPersona'
        thread_id:
          type: string
          format: uuid
        activity_group_id:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        message_id:
          type: integer
          minimum: 1
        closed:
          type: boolean
        removed:
          type: boolean
    GroupChatReceipt:
      type: object
      additionalProperties: false
      required:
      - recorded
      - operation_id
      - receipt
      properties:
        recorded:
          type: boolean
        operation_id:
          type: string
          format: uuid
        receipt:
          $ref: '#/components/schemas/GroupChatMutation'
    GroupChatReadAck:
      type: object
      additionalProperties: false
      required:
      - thread_id
      - last_message_id
      properties:
        thread_id:
          type: string
          format: uuid
        last_message_id:
          type: integer
          minimum: 0
    GroupChatPolicyChange:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - revision
      - staff_learners
      - staff_guardians
      - staff_staff
      - learner_shared_replies
      - guardian_shared_replies
      properties:
        operation_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        staff_learners:
          type: boolean
        staff_guardians:
          type: boolean
        staff_staff:
          type: boolean
        learner_shared_replies:
          type: boolean
        guardian_shared_replies:
          type: boolean
    GroupChatThreadCreate:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - persona
      - body
      - language
      - kind
      - title
      properties:
        operation_id:
          type: string
