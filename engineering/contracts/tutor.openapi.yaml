tags:
- name: Tutor
  description: Own-learner subject tutoring, approved private working crops and metadata-only guardian summaries.
paths:
  /tutor/configuration:
    get:
      operationId: getTutorConfiguration
      tags:
      - Tutor
      summary: getTutorConfiguration
      description: Fresh active approved own-learner subject/source authority is required before retrieval and replay.
        Parent access is limited to the separate deterministic summary. Private writes accept body fields only.
        Feedback is provisional and never posts official marks; provider activation and privacy/safety qualification
        remain separate.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      responses:
        '200':
          description: Fresh private Tutor result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
