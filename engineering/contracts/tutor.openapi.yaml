components:
  schemas:
    TutorSourceChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      properties:
        id:
          type: integer
          minimum: 1
        title:
          type: string
    TutorGroupChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - subject_id
      - subject_name
      - sources
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        subject_id:
          type: integer
          minimum: 1
        subject_name:
          anyOf:
          - type: string
          - type: 'null'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/TutorSourceChoice'
    TutorConfiguration:
      type: object
      additionalProperties: false
      required:
      - school_id
      - reader_id
      - learner_id
      - session_year_id
      - groups
      - inference_enabled
      - photo_requires_approved_crop
      - feedback_is_provisional
      properties:
        school_id:
          type: integer
          minimum: 1
        reader_id:
          type: integer
          minimum: 1
        learner_id:
          type: integer
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TutorGroupChoice'
        inference_enabled:
          type: boolean
        photo_requires_approved_crop:
          type: boolean
        feedback_is_provisional:
          type: boolean
    TutorSessionResult:
      type: object
      additionalProperties: false
      required:
      - school_id
      - reader_id
      - id
      - learner_id
      - subject_id
      - group_id
      - session_year_id
      - state
      properties:
        school_id:
          type: integer
          minimum: 1
        reader_id:
          type: integer
          minimum: 1
        id:
          type: string
          format: uuid
        learner_id:
          type: integer
          minimum: 1
        subject_id:
          type: integer
          minimum: 1
        group_id:
          type: integer
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - open
          - closed
    TutorSessionListItem:
      type: object
      additionalProperties: false
      required:
      - id
      - subject_id
      - state
      properties:
        id:
          type: string
          format: uuid
        subject_id:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - open
          - closed
    TutorSessionList:
      type: object
      additionalProperties: false
      required:
      - school_id
      - reader_id
      - learner_id
      - page
      - last_page
      - sessions
      properties:
        school_id:
          type: integer
          minimum: 1
        reader_id:
          type: integer
          minimum: 1
        learner_id:
          type: integer
          minimum: 1
        page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TutorSessionListItem'
    TutorFeedback:
      type: object
      additionalProperties: false
      required:
      - subject_token
      - kind
      - text
      - question
      properties:
        subject_token:
          type: string
          pattern: ^[a-f0-9]{64}$
        kind:
          type: string
          enum:
          - hint
          - question
          - correction
          - refusal
        text:
          type: string
          maxLength: 1600
        question:
          type: string
          maxLength: 400
    TutorTurn:
      type: object
      additionalProperties: false
      required:
      - id
      - operation_id
      - state
      - question
      - working
      - response
      - failure_code
      - support_message
      - provisional
      properties:
        id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - pending
          - completed
          - failed
          - quarantined
          - purged
        question:
          anyOf:
          - type: string
          - type: 'null'
        working:
          anyOf:
          - type: string
          - type: 'null'
        response:
          anyOf:
          - $ref: '#/components/schemas/TutorFeedback'
          - type: 'null'
        failure_code:
          anyOf:
          - type: string
          - type: 'null'
        support_message:
          anyOf:
          - type: string
          - type: 'null'
        provisional:
          type: boolean
    TutorTurnResult:
      type: object
      additionalProperties: false
      required:
      - school_id
      - reader_id
      - id
      - operation_id
      - state
      - question
      - working
      - response
      - failure_code
      - support_message
      - provisional
      properties:
        school_id:
          type: integer
          minimum: 1
        reader_id:
          type: integer
          minimum: 1
        id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - pending
          - completed
          - failed
          - quarantined
          - purged
        question:
          anyOf:
          - type: string
          - type: 'null'
        working:
          anyOf:
          - type: string
          - type: 'null'
        response:
          anyOf:
          - $ref: '#/components/schemas/TutorFeedback'
          - type: 'null'
        failure_code:
          anyOf:
          - type: string
          - type: 'null'
        support_message:
          anyOf:
          - type: string
          - type: 'null'
        provisional:
          type: boolean
    TutorSessionDetail:
      type: object
      additionalProperties: false
      required:
      - school_id
      - reader_id
      - id
      - learner_id
      - subject_id
      - group_id
      - session_year_id
      - state
      - page
      - last_page
      - turns
      - pending_photos
      properties:
        school_id:
          type: integer
          minimum: 1
        reader_id:
          type: integer
          minimum: 1
        id:
          type: string
          format: uuid
        learner_id:
          type: integer
          minimum: 1
        subject_id:
          type: integer
          minimum: 1
        group_id:
          type: integer
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - open
          - closed
        page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        turns:
          type: array
          items:
            $ref: '#/components/schemas/TutorTurn'
        pending_photos:
          type: array
          items:
            $ref: '#/components/schemas/TutorPhotoReceipt'
    TutorPhotoReceipt:
      type: object
      additionalProperties: false
      required:
      - school_id
      - reader_id
      - id
      - sha256
      - mime
      - operation_id
      properties:
        school_id:
          type: integer
          minimum: 1
        reader_id:
          type: integer
          minimum: 1
        id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        mime:
          type: string
          enum:
          - image/png
        operation_id:
          type: string
          format: uuid
    TutorPhotoRevocation:
      type: object
      additionalProperties: false
      required:
      - school_id
      - reader_id
      - id
      - revoked
      properties:
        school_id:
          type: integer
          minimum: 1
        reader_id:
          type: integer
          minimum: 1
        id:
          type: string
          format: uuid
        revoked:
          type: boolean
    TutorParentSummary:
      type: object
      additionalProperties: false
      required:
      - school_id
      - reader_id
      - learner_id
      - subject_id
