components:
  schemas:
    DisciplineChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 0
          maxLength: 200
    DisciplineLevel:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      - threshold
      - kind
      - sanctions
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
        name:
          type: string
          minLength: 0
          maxLength: 150
        threshold:
          type: integer
          minimum: 1
          maximum: 1000
        kind:
          type: string
          enum:
          - sanction
          - hearing
        sanctions:
          type: array
          minItems: 0
          maxItems: 30
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]{0,39}$
    DisciplineSanction:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      - kind
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
        name:
          type: string
          minLength: 0
          maxLength: 150
        kind:
          type: string
          enum:
          - notice
          - detention
          - restorative
    DisciplineInfraction:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      - base_level
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
        name:
          type: string
          minLength: 0
          maxLength: 150
        base_level:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
    DisciplineDefinition:
      type: object
      additionalProperties: false
      required:
      - counter_scope
      - reset
      - levels
      - sanctions
      - infractions
      properties:
        counter_scope:
          type: string
          enum:
          - same_infraction
          - all_infractions
        reset:
          type: string
          enum:
          - school_year
          - term
          - rolling_days
        rolling_days:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 365
        levels:
          type: array
          minItems: 2
          maxItems: 8
          items:
            $ref: '#/components/schemas/DisciplineLevel'
        sanctions:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/DisciplineSanction'
        infractions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DisciplineInfraction'
    DisciplineFramework:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - revision
      - definition
      properties:
        id:
          type: integer
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 0
          maxLength: 150
        revision:
          type: integer
          minimum: 1
        definition:
          $ref: '#/components/schemas/DisciplineDefinition'
    DisciplineOptionalFramework:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - id
      - title
      - revision
      - definition
      properties:
        id:
          type: integer
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 0
          maxLength: 150
        revision:
          type: integer
          minimum: 1
        definition:
          $ref: '#/components/schemas/DisciplineDefinition'
    DisciplineFrameworkView:
      type: object
      additionalProperties: false
      required:
      - session_year_id
      - framework
      properties:
        session_year_id:
          type: integer
          minimum: 1
        framework:
          $ref: '#/components/schemas/DisciplineOptionalFramework'
    DisciplineConfiguration:
      type: object
      additionalProperties: false
      required:
      - session_year_id
      - today
      - can_manage
      - can_hear
      - grade_ids
      - grades
      - years
      - framework
      properties:
        writable:
          type: boolean
          description: Optional fresh capability; absence preserves older responses. Record-specific authority remains required.
        session_year_id:
          type: integer
          minimum: 1
        today:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        can_manage:
