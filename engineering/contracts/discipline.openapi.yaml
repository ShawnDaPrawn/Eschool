tags:
- name: Discipline
  description: School-defined discipline, retained reviews, guardian acknowledgement and supervised detention.
paths:
  /discipline/configuration:
    get:
      operationId: getDisciplineConfiguration
      tags:
      - Discipline
      summary: getDisciplineConfiguration
      description: School-configured discipline; no default sanctions or automatic expulsion. Fresh school/role
        and dated allocation or grade leadership authorize staff records. Families see published owned
        history only; only verified guardians acknowledge. Hearing decisions require an appointed principal.
        Private body-only UUID writes use encrypted feature receipts and reauthorize before replay. Detention
        supervision is a separate explicit session grant; unknown attendance remains null.
      parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: Fresh authorized discipline result; private body and metadata never cache.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisciplineConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '423':
