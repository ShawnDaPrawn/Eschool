components:
  securitySchemes:
    foundationDeviceAuth:
      type: http
      scheme: bearer
      description: 'Single Authorization: Bearer NED1.school.device.secret, classroom kind only. No cookies, query
        credentials or custom secret headers.'
    foundationLearnerAuth:
      type: http
      scheme: bearer
      description: 'Single Authorization: Bearer NEF1.school.session.secret~NED1.school.device.secret. Both credentials
        are validated together; no general user or gate authority.'
  schemas:
    FoundationGroupChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - eligible
      - revision
      - can_authorize
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 191
        eligible:
          type: boolean
        revision:
          type: integer
          minimum: 0
        can_authorize:
          type: boolean
    FoundationTablet:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - status
      - expires_at
      - active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          minLength: 1
          maxLength: 30
        expires_at:
          type: string
          format: date-time
        active:
          type: boolean
    FoundationLeaseSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - device_id
      - teaching_group_id
      - expires_at
      - active
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        teaching_group_id:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time
        active:
          type: boolean
    FoundationConfiguration:
      type: object
      additionalProperties: false
      required:
      - school_id
      - reader_id
      - session_year_id
      - can_manage
      - can_grant
      - writable
      - page
      - next_page
      - groups
      - devices
      - leases
      properties:
        school_id:
          type: integer
          minimum: 1
        reader_id:
          type: integer
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        can_manage:
          type: boolean
        can_grant:
          type: boolean
        writable:
          type: boolean
        page:
          type: integer
          minimum: 1
        next_page:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        groups:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/FoundationGroupChoice'
        devices:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FoundationTablet'
        leases:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FoundationLeaseSummary'
    FoundationOperationInput:
      type: object
      additionalProperties: false
      required:
      - operation_id
      properties:
        operation_id:
          type: string
          format: uuid
    FoundationEligibilityInput:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - revision
      - eligible
      - reason
      properties:
        operation_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        eligible:
          type: boolean
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    FoundationEligibility:
      type: object
      additionalProperties: false
      required:
      - teaching_group_id
      - eligible
      - revision
      properties:
        teaching_group_id:
          type: integer
          minimum: 1
        eligible:
          type: boolean
        revision:
          type: integer
          minimum: 1
    FoundationRegistrationInput:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - name
      - setup_code
      - days
      properties:
        operation_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        setup_code:
          type: string
          pattern: ^NESET1\.[A-Za-z0-9_-]{43}$
          description: Public Tablet setup code generated by the controlled tablet. Never a private key.
        days:
          type: integer
          minimum: 1
          maximum: 30
    FoundationRegistration:
      type: object
      additionalProperties: false
      required:
      - id
      - tablet_access_code
      - kind
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        tablet_access_code:
          type: string
          maxLength: 159
          pattern: ^NED1\.[1-9][0-9]*\.[a-f0-9-]{36}\.[a-f0-9]{64}$
          description: Private classroom-only tablet access code. Keep in memory and never send in a URL, cookie
            or an ordinary authentication request.
        kind:
          type: string
          pattern: ^classroom$
        expires_at:
          type: string
          format: date-time
    FoundationGrantInput:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - device_id
      - teaching_group_id
      - minutes
      properties:
        operation_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        teaching_group_id:
          type: integer
          minimum: 1
        minutes:
          type: integer
          minimum: 1
          maximum: 60
    FoundationAuthorization:
      type: object
      additionalProperties: false
      required:
      - id
      - device_id
      - teaching_group_id
      - classroom_authorization
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        teaching_group_id:
          type: integer
          minimum: 1
        classroom_authorization:
          type: string
          maxLength: 159
          pattern: ^NECL1\.[1-9][0-9]*\.[a-f0-9-]{36}\.[a-f0-9]{64}$
          description: Short Teacher delegation for this exact classroom device and current eligible allocated group.
        expires_at:
          type: string
          format: date-time
    FoundationSelectInput:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - classroom_authorization
      - locator
      properties:
        operation_id:
          type: string
          format: uuid
        classroom_authorization:
          type: string
          minLength: 1
          maxLength: 159
        locator:
          type: string
          maxLength: 90
          pattern: ^NELOC1\.[1-9][0-9]*\.[a-f0-9-]{36}$
          description: Printed unsigned locator. It selects an approved current-group learner and never records
            a gate scan.
    FoundationLearnerContext:
      type: object
      additionalProperties: false
      required:
      - school_id
      - learner_id
      - name
      - teaching_group_id
      - expires_at
      - restricted
      - capabilities
      properties:
        school_id:
          type: integer
          minimum: 1
        learner_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 191
        teaching_group_id:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time
        restricted:
          type: boolean
          description: Always true. No ordinary account or gate authority.
        capabilities:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            pattern: ^daily_practice$
    FoundationSelection:
      type: object
      additionalProperties: false
      required:
