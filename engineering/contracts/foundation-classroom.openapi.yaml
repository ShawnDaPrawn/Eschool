tags:
- name: FoundationClassroom
  description: Restricted school classroom tablet entry and current-group daily practice.
paths:
  /foundation-classroom/configuration:
    get:
      operationId: getFoundationConfiguration
      tags:
      - FoundationClassroom
      summary: getFoundationConfiguration
      description: Fresh school, manager/Teacher allocation, eligibility, device issuer, guardian approval and current
        card authority are checked before data, writes and receipt replay. No ordinary user authentication or gate
        scan is created. Private writes accept body fields only and reject unknown fields; uncertain writes retry
        the same operation UUID. Existing short delegations validate classroom credentials as reads, so read-only
        card inventory does not disable independently writable daily practice; new registration and Teacher grants
        still require writable card inventory.
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100000
      responses:
        '200':
          description: Freshly authorized private classroom result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFoundationConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
