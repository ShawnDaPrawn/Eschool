tags:
- name: Recognition
  description: Dated house points and permanent awards, scoped to current school authority.
paths:
  /recognition/{module}/access:
    get:
      operationId: getRecognitionAccess
      tags:
      - Recognition
      summary: getRecognitionAccess
      description: Current school, account, roles, module and dated scope are checked again before exact UUID replay.
        Private changes use JSON bodies; receipts contain references only. House-point history is separate from
        permanent award presentations. Module-incompatible paths return 404.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      - name: module
        in: path
        required: true
        schema:
          type: string
          enum:
          - house_points
          - awards
      responses:
        '200':
          description: Authorized recognition projection or immutable operation reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
