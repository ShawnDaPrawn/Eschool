  /growth/progress/configuration:
    get:
      operationId: getProgressConfiguration
      tags:
      - Growth
      summary: getProgressConfiguration
      description: Fresh school, role, assignment and owner checks precede private body loading and receipt
        replay. Counselling requires a dedicated restricted role and current note-only caseload; principals
        administer assignment metadata without body access. Platform identities and impersonation cannot
        read counselling. Bodies and receipts are encrypted; visibility and ownership are immutable. Family
        progress uses approved own-child frozen released snapshots only. Writes require a stable operation_id
        UUID; historical note writes return 423. Every response forbids caching.
      parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: Private scoped progress or learner note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
