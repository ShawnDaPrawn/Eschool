          type: integer
          minimum: 1
        learner_id:
          type: integer
          minimum: 1
        subject_id:
          type:
          - integer
          - 'null'
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        author_id:
          type: integer
          minimum: 1
        author_name:
          type: string
        visibility:
          type: string
          enum:
          - tutor
          - staff
          - counselling
        revision:
          type: integer
          minimum: 1
        archived:
          type: boolean
        updated_at:
          type: string
          format: date-time
    LearnerNoteDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - learner_id
      - subject_id
      - session_year_id
      - author_id
      - author_name
      - visibility
      - revision
      - archived
      - updated_at
      - body
      properties:
        id:
          type: integer
          minimum: 1
        learner_id:
          type: integer
          minimum: 1
        subject_id:
          type:
          - integer
          - 'null'
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        author_id:
          type: integer
          minimum: 1
        author_name:
          type: string
        visibility:
          type: string
          enum:
          - tutor
          - staff
          - counselling
        revision:
          type: integer
          minimum: 1
        archived:
          type: boolean
        updated_at:
          type: string
          format: date-time
        body:
          type: string
          maxLength: 20000
    LearnerNoteList:
      type: object
      additionalProperties: false
      required:
      - notes
      - next_after
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/LearnerNoteMetadata'
          maxItems: 100
        next_after:
          type:
          - integer
          - 'null'
          minimum: 1
    LearnerNoteRevision:
      type: object
      additionalProperties: false
      required:
      - revision
      - author_id
      - author_name
      - body
      - archived
      - created_at
      properties:
        revision:
          type: integer
          minimum: 1
        author_id:
          type: integer
          minimum: 1
        author_name:
          type: string
        body:
          type: string
          maxLength: 20000
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
    LearnerNoteHistory:
      type: object
      additionalProperties: false
      required:
      - note_id
      - revisions
      properties:
        note_id:
          type: integer
          minimum: 1
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/LearnerNoteRevision'
          maxItems: 100
    LearnerNoteAssignment:
      type: object
      additionalProperties: false
      required:
      - id
      - learner_id
      - staff_user_id
      - staff_name
      - starts_on
      - ends_on
      - revision
      properties:
        id:
          type: integer
          minimum: 1
        learner_id:
          type: integer
          minimum: 1
        staff_user_id:
          type: integer
          minimum: 1
        staff_name:
          type: string
        starts_on:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        ends_on:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        revision:
          type: integer
          minimum: 1
    LearnerNoteAssignments:
      type: object
      additionalProperties: false
      required:
      - learner_id
      - assignments
      properties:
        learner_id:
          type: integer
          minimum: 1
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/LearnerNoteAssignment'
          maxItems: 100
    LearnerNoteCreate:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - session_year_id
      - visibility
      - body
      properties:
        operation_id:
          type: string
          format: uuid
        session_year_id:
          type: integer
          minimum: 1
        subject_id:
          type:
          - integer
          - 'null'
          minimum: 1
        visibility:
          type: string
          enum:
          - tutor
          - staff
          - counselling
        body:
          type: string
          maxLength: 20000
    LearnerNoteUpdate:
      type: object
      additionalProperties: false
