          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '423':
          description: Historical learner notes are read-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerNoteAssignmentWrite'
components:
  schemas:
    ProgressBandSettings:
      type: object
      additionalProperties: false
      required:
      - high_bp
      - secure_bp
      - minimum_coverage_bp
      - revision
      properties:
        high_bp:
          type: integer
          minimum: 1
          maximum: 10000
        secure_bp:
          type: integer
          minimum: 0
          maximum: 9999
        minimum_coverage_bp:
          type: integer
          minimum: 1
          maximum: 10000
        revision:
          type: integer
          minimum: 0
    ProgressOption:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
    ProgressGroup:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - subject_id
      - subject_name
      - grade_name
      - session_year_id
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        subject_id:
          type: integer
          minimum: 1
        subject_name:
          type: string
        grade_name:
          type: string
        session_year_id:
          type: integer
          minimum: 1
    ProgressConfiguration:
      type: object
      additionalProperties: false
      required:
      - session_year_id
      - can_manage_bands
      - can_assign_counselling
      - can_read_caseload
      - settings
      - restricted_staff
      - years
      - terms
      - groups
      properties:
        session_year_id:
          type: integer
          minimum: 1
        can_manage_bands:
          type: boolean
        can_assign_counselling:
          type: boolean
        can_read_caseload:
          type: boolean
        settings:
          $ref: '#/components/schemas/ProgressBandSettings'
        restricted_staff:
          type: array
          items:
            $ref: '#/components/schemas/ProgressOption'
          maxItems: 500
        years:
          type: array
          items:
            $ref: '#/components/schemas/ProgressOption'
          maxItems: 100
        terms:
          type: array
          items:
            $ref: '#/components/schemas/ProgressOption'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ProgressGroup'
          maxItems: 500
    ProgressLearnerOption:
      type: object
      additionalProperties: false
      required:
      - learner_id
      - display_name
      properties:
        learner_id:
          type: integer
          minimum: 1
        display_name:
          type: string
    ProgressRoster:
      type: object
      additionalProperties: false
      required:
      - group_id
      - current_page
      - last_page
      - total
      - learners
      properties:
        group_id:
          type: integer
          minimum: 1
        current_page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        learners:
          type: array
          items:
            $ref: '#/components/schemas/ProgressLearnerOption'
          maxItems: 100
    ProgressLearnerList:
      type: object
      additionalProperties: false
      required:
      - current_page
      - last_page
      - total
      - learners
      properties:
        current_page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        learners:
          type: array
          items:
            $ref: '#/components/schemas/ProgressLearnerOption'
          maxItems: 100
    ProgressStaffBand:
      type: object
      additionalProperties: false
      required:
      - audience
      - learner_id
      - subject_id
      - session_year_id
      - term_id
      - snapshot_id
      - provisional
      - band
      - percentage_bp
      - coverage_bp
      - alerts_eligible
      - settings_revision
      properties:
        audience:
          type: string
          enum:
          - staff
        learner_id:
          type: integer
          minimum: 1
        subject_id:
          type: integer
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        term_id:
          type: integer
          minimum: 1
        snapshot_id:
          type: integer
          minimum: 1
        provisional:
          type: boolean
        band:
          type: string
          enum:
          - high
          - secure
          - support
          - insufficient_evidence
        percentage_bp:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 10000
        coverage_bp:
          type: integer
          minimum: 0
          maximum: 10000
        alerts_eligible:
          type: boolean
        settings_revision:
          type: integer
          minimum: 0
    ProgressReleasedBand:
      type: object
      additionalProperties: false
      required:
      - subject_name
      - grade_name
      - release_id
      - subject_id
      - grade_level_id
      - session_year_id
      - term_id
      - mode
      - provisional
      - rating_level
      - released_at
      - released_percentage_bp
      - band
      - percentage_bp
      - coverage_bp
      - alerts_eligible
      - settings_revision
      properties:
        subject_name:
          type: string
        grade_name:
          type: string
        release_id:
          type: integer
          minimum: 1
        subject_id:
          type: integer
          minimum: 1
        grade_level_id:
          type: integer
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        term_id:
          type:
          - integer
          - 'null'
          minimum: 1
        mode:
          type: string
          enum:
          - running
          - official
        provisional:
          type: boolean
        rating_level:
          type:
          - integer
          - 'null'
          minimum: 0
        released_at:
          type: string
          format: date-time
        released_percentage_bp:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 10000
        band:
          type: string
          enum:
          - high
          - secure
          - support
          - insufficient_evidence
        percentage_bp:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 10000
        coverage_bp:
          type: integer
          minimum: 0
          maximum: 10000
        alerts_eligible:
          type: boolean
        settings_revision:
          type: integer
          minimum: 0
    ProgressFamilyBands:
      type: object
      additionalProperties: false
      required:
      - audience
      - learner_id
      - results
      properties:
        audience:
          type: string
          enum:
          - family
        learner_id:
          type: integer
          minimum: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProgressReleasedBand'
    LearnerNoteMetadata:
      type: object
      additionalProperties: false
      required:
      - id
      - learner_id
      - subject_id
      - session_year_id
      - author_id
      - author_name
      - visibility
      - revision
      - archived
      - updated_at
      properties:
