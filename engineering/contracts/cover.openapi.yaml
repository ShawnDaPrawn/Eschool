components:
  schemas:
    CoverTeacher:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
    CoverSource:
      type: object
      additionalProperties: false
      required:
      - lesson_id
      - lesson_revision
      - session_year_id
      - teacher_id
      - teacher_name
      - group_id
      - homeroom_id
      - title
      - subject_name
      - room_id
      - room_name
      - period_id
      - starts_at
      - ends_at
      - on_date
      properties:
        lesson_id:
          type: integer
          minimum: 1
        lesson_revision:
          type: integer
          minimum: 1
        session_year_id:
          type: integer
          minimum: 1
        teacher_id:
          type: integer
          minimum: 1
        teacher_name:
          type: string
        group_id:
          type:
          - integer
          - 'null'
          minimum: 1
        homeroom_id:
          type:
          - integer
          - 'null'
          minimum: 1
        title:
          type: string
        subject_name:
          type:
          - string
          - 'null'
        room_id:
          type: integer
          minimum: 1
        room_name:
          type: string
        period_id:
          type: integer
          minimum: 1
        starts_at:
          type: string
        ends_at:
          type: string
        on_date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
    CoverOccurrence:
      type: object
      additionalProperties: false
      required:
      - id
      - absence_id
      - revision
      - state
      - on_date
      - source
      - substitute_teacher_id
      - substitute_name
      properties:
        id:
          type: integer
          minimum: 1
        absence_id:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - open
          - assigned
          - cancelled
          - needs_review
        on_date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        source:
          $ref: '#/components/schemas/CoverSource'
        substitute_teacher_id:
          type:
          - integer
          - 'null'
          minimum: 1
        substitute_name:
          type:
          - string
          - 'null'
    CoverAbsenceSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - state
      - teacher_id
      - teacher_name
      - starts_on
      - ends_on
      properties:
        id:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - requested
          - cancelled
        teacher_id:
          type: integer
          minimum: 1
        teacher_name:
          type: string
        starts_on:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        ends_on:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
    CoverAbsence:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - state
      - teacher_id
      - teacher_name
      - starts_on
      - ends_on
      - session_year_id
      - reason
      - cancel_reason
      - occurrences
      properties:
        id:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - requested
          - cancelled
        teacher_id:
          type: integer
          minimum: 1
        teacher_name:
          type: string
        starts_on:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        ends_on:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        session_year_id:
          type: integer
          minimum: 1
        reason:
          type:
          - string
          - 'null'
        cancel_reason:
          type:
          - string
          - 'null'
        occurrences:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CoverOccurrence'
    CoverConfiguration:
      type: object
      additionalProperties: false
      required:
      - session_year_id
      - year_name
      - can_manage
      - teachers
      - current_page
      - last_page
      - total
      - absences
      properties:
        session_year_id:
          type: integer
          minimum: 1
        year_name:
          type: string
        can_manage:
          type: boolean
        teachers:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CoverTeacher'
        current_page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        absences:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CoverAbsenceSummary'
    CoverMine:
      type: object
      additionalProperties: false
      required:
      - occurrences
      properties:
        occurrences:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CoverOccurrence'
    CoverCandidates:
      type: object
      additionalProperties: false
      required:
      - occurrence_id
      - revision
      - teachers
      properties:
        occurrence_id:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        teachers:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CoverTeacher'
    CoverCreateInput:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - session_year_id
      - teacher_id
      - starts_on
      - ends_on
      properties:
        operation_id:
          type: string
          format: uuid
        session_year_id:
          type: integer
          minimum: 1
        teacher_id:
          type: integer
          minimum: 1
        starts_on:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        ends_on:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        reason:
          type:
          - string
          - 'null'
          maxLength: 500
    CoverChangeInput:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - revision
      - reason
      properties:
        operation_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
    CoverAssignmentInput:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - revision
      - substitute_teacher_id
      properties:
        operation_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        substitute_teacher_id:
          type: integer
          minimum: 1
    CoverConfigurationResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - code
      - data
      properties:
        error:
          type: boolean
        message:
          type: string
        code:
          type: integer
        data:
          $ref: '#/components/schemas/CoverConfiguration'
    CoverAbsenceResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - code
      - data
      properties:
        error:
          type: boolean
        message:
          type: string
        code:
          type: integer
        data:
          $ref: '#/components/schemas/CoverAbsence'
    CoverOccurrenceResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - code
      - data
      properties:
        error:
          type: boolean
        message:
          type: string
        code:
          type: integer
        data:
          $ref: '#/components/schemas/CoverOccurrence'
    CoverCandidatesResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - code
      - data
      properties:
        error:
          type: boolean
        message:
          type: string
        code:
          type: integer
        data:
          $ref: '#/components/schemas/CoverCandidates'
    CoverMineResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - code
      - data
      properties:
        error:
          type: boolean
        message:
          type: string
        code:
          type: integer
        data:
          $ref: '#/components/schemas/CoverMine'
