tags:
- name: Pastoral
  description: Scoped school cover and restricted learner support.
paths:
  /pastoral/cover/configuration:
    get:
      operationId: getCoverConfiguration
      tags:
      - Pastoral
      summary: getCoverConfiguration
      description: Fresh school, module, role and ownership checks. Private absence reasons are limited
        to the requester and authorized managers. Substitutes receive only assigned dated occurrences.
        Writes require a stable operation_id UUID and revision; retries replay only after fresh authorization.
        Source changes require explicit review and refresh. Read windows are limited to 31 days. No permanent
        teaching or marks access is granted.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: session_year_id
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      - name: from
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      - name: to
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Private scoped relief cover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
