components:
  schemas:
    ExamCoachGroupChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - subject_name
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 191
        subject_name:
          type: string
          maxLength: 191
    ExamCoachTopicChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 191
    ExamCoachLicence:
      type: object
      additionalProperties: false
      required:
      - kind
      - reference
      - statement
      - confirmed
      properties:
        kind:
          type: string
          enum:
          - school_owned
          - open_licence
          - permission
        reference:
          type: string
          maxLength: 1000
          minLength: 3
        statement:
          type: string
          maxLength: 2000
          minLength: 20
        confirmed:
          type: boolean
          description: Must be true; a staff member attests concrete rights before publication.
        expires_on:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
    ExamCoachQuestion:
      type: object
      additionalProperties: false
      required:
      - number
      - prompt
      - max_units
      - topic_ids
      properties:
        number:
          type: string
          maxLength: 16
          pattern: ^[A-Za-z0-9().-]{1,16}$
        prompt:
          type: string
          maxLength: 4000
          minLength: 1
        memo:
          type: string
          maxLength: 8000
          minLength: 1
        max_units:
          type: integer
          minimum: 1
          maximum: 100000
        topic_ids:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
          maxItems: 10
    ExamCoachQuestionWrite:
      type: object
      additionalProperties: false
      required:
      - number
      - prompt
      - memo
      - max_units
      - topic_ids
      properties:
        number:
          type: string
          maxLength: 16
          pattern: ^[A-Za-z0-9().-]{1,16}$
        prompt:
          type: string
          maxLength: 4000
          minLength: 1
        memo:
          type: string
          maxLength: 8000
          minLength: 1
        max_units:
          type: integer
          minimum: 1
          maximum: 100000
        topic_ids:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
          maxItems: 10
    ExamCoachConfiguration:
      type: object
      additionalProperties: false
      required:
      - reader_id
      - learner_id
      - staff_groups
      - learner_groups
      - writable
      properties:
        reader_id:
          type: integer
          minimum: 1
        learner_id:
          anyOf:
          - type: integer
            minimum: 1
