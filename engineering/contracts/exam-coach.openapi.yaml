  /exam-coach/plans/{plan}:
    get:
      operationId: getExamCoachStudyPlan
      tags:
      - ExamCoach
      summary: getExamCoachStudyPlan
      description: Fresh current-school, expected-account, group and source authority is required before retrieval
        and replay. Staff memos never enter learner paper responses. Writes accept body fields only and preserve
        immutable operation UUIDs. Licence expiry, withdrawal and changed schedules invalidate derived reads. No
        action publishes official marks.
      parameters:
