paths:
  /facilitator/sign-in:
    post:
      operationId: signInFacilitator
      tags:
      - Platform
      summary: signInFacilitator
      description: Fresh dated school membership and an explicit facilitator session profile are required. This
        identity grants no teacher or whole-school permissions. Sign-in returns setup requirements before issuing
        a session; only current accepted policy versions and a completed password change allow authentication. Responses
        are private and never cached.
      responses:
        '200':
          description: Private facilitator session result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilitatorSignInResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          description: Credentials verified; complete password/policy setup and resubmit. No authenticated session
            has been issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilitatorSignInResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilitatorSignInInput'
  /facilitator/session:
    get:
      operationId: getFacilitatorSession
      tags:
      - Platform
      summary: getFacilitatorSession
      description: Fresh dated school membership and an explicit facilitator session profile are required. This
        identity grants no teacher or whole-school permissions. Sign-in returns setup requirements before issuing
        a session; only current accepted policy versions and a completed password change allow authentication. Responses
        are private and never cached.
      responses:
        '200':
          description: Private facilitator session result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilitatorSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
  /facilitator/sign-out:
    post:
      operationId: signOutFacilitator
      tags:
      - Platform
      summary: signOutFacilitator
      description: Fresh dated school membership and an explicit facilitator session profile are required. This
        identity grants no teacher or whole-school permissions. Sign-in returns setup requirements before issuing
        a session; only current accepted policy versions and a completed password change allow authentication. Responses
        are private and never cached.
      responses:
        '200':
          description: Private facilitator session result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilitatorSignOutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
components:
  schemas:
    FacilitatorSchool:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - slug
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        slug:
          type: string
    FacilitatorFeatures:
      type: object
      additionalProperties: false
      required:
      - groups
      - messages
      - counselling
      properties:
        school_assistance:
          type: boolean
          description: Optional current school-office support capability; exact thread assignment is checked before every private body read.
        live_updates:
          type: boolean
          description: Optional fresh live-session capability, emitted only when the live transport is implemented
            and authorized.
        gallery:
          type: boolean
          description: Optional current gallery group capability. Every group, file and tag requires fresh source
            authority.
        daily_practice:
          type: boolean
          description: Optional fresh allocated-Teacher practice authoring capability. Every group/source is authorized
            again.
        consultations:
          type: boolean
          description: Optional current-school consultation capability; every ballot still requires fresh audience
            authority.
        private_notices:
          type: boolean
          description: Optional fresh dedicated staff inbox capability; absence means unavailable. Every notice
            still requires its source grant.
        house_points:
          type: boolean
          description: Optional fresh capability; absence preserves older responses. Record-specific authority remains
            required.
        awards:
          type: boolean
          description: Optional fresh capability; absence preserves older responses. Record-specific authority remains
            required.
        discipline:
          type: boolean
          description: Optional capability; absence preserves older facilitator session responses. Fresh record-specific
            authority remains required.
        risk_interventions:
          type: boolean
          description: Fresh original-kind authority for private risk interventions; absence means unavailable.
        groups:
          type: boolean
        messages:
          type: boolean
        counselling:
          type: boolean
        support_plans:
          type: boolean
          description: Optional capability; absence preserves compatibility with older facilitator sessions. Fresh
            record-specific authority is still required.
        learner_notes:
          type: boolean
          description: Optional capability; absence preserves compatibility with older facilitator sessions. Fresh
            record-specific authority is still required.
        my_grade:
          type: boolean
          description: A current dated grade-head working hub is available.
        cards:
          type: boolean
          description: Fresh card module/account access; does not grant issuance or device management rights.
        family_forms:
          type: boolean
          description: Fresh staff family-form capability; does not grant guardian or clinical access.
        exam_coach:
          type: boolean
          description: Optional current exam-coach entry capability.
    FacilitatorProfile:
      type: object
      additionalProperties: false
      required:
      - user_id
      - school_id
      - name
      - roles
      - schools
      - features
      properties:
        user_id:
          type: integer
          minimum: 1
        school_id:
          type: integer
          minimum: 1
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        schools:
          type: array
          items:
            $ref: '#/components/schemas/FacilitatorSchool'
        features:
          $ref: '#/components/schemas/FacilitatorFeatures'
    FacilitatorPolicy:
      type: object
      additionalProperties: false
      required:
      - document
      - version
      - title
      - text
      properties:
        document:
          type: string
          enum:
          - navigateed
          - school
        version:
          type: string
          pattern: ^[a-f0-9]{64}$
        title:
          type: string
        text:
          type: string
    FacilitatorSignInInput:
      type: object
      additionalProperties: false
      required:
      - school
      - email
      - password
      properties:
        school:
          type: string
          maxLength: 191
        email:
          type: string
          maxLength: 191
        password:
          type: string
          maxLength: 128
          writeOnly: true
        new_password:
          type: string
          maxLength: 128
          writeOnly: true
        new_password_confirmation:
          type: string
          maxLength: 128
          writeOnly: true
        acceptances:
          type: object
          additionalProperties:
            type: string
            pattern: ^[a-f0-9]{64}$
    FacilitatorSignInData:
      type: object
      additionalProperties: false
      required:
      - authenticated
      - token
      - profile
      - password_change_required
      - documents
      properties:
        authenticated:
          type: boolean
        token:
          anyOf:
          - type: string
          - type: 'null'
        profile:
          anyOf:
          - $ref: '#/components/schemas/FacilitatorProfile'
          - type: 'null'
        password_change_required:
          type: boolean
        documents:
          type: array
          items:
            $ref: '#/components/schemas/FacilitatorPolicy'
    FacilitatorSignInResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/FacilitatorSignInData'
        code:
          anyOf:
          - type: string
          - type: 'null'
    FacilitatorSessionResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/FacilitatorProfile'
        code:
          anyOf:
          - type: string
          - type: 'null'
    FacilitatorSignOutResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
        message:
          type: string
        data:
          anyOf:
          - type: object
            additionalProperties: false
          - type: 'null'
        code:
          anyOf:
          - type: string
          - type: 'null'
