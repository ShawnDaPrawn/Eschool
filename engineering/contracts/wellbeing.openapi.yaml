components:
  schemas:
    WellbeingNamedChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
    WellbeingLearnerChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - admission_no
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        admission_no:
          type: string
    WellbeingCategory:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - emergency_guidance
      - active
      - revision
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        emergency_guidance:
          type: string
        active:
          type: boolean
        revision:
          type: integer
          minimum: 1
    WellbeingAccess:
      type: object
      additionalProperties: false
      required:
      - can_configure
      - professional
      - can_triage
      - can_casework
      - can_write
      - today
      - school_slug
      - emergency_guidance
      properties:
        can_configure:
          type: boolean
        professional:
          type: boolean
        can_triage:
          type: boolean
        can_casework:
          type: boolean
        can_write:
          type: boolean
        today:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        school_slug:
          type: string
        emergency_guidance:
          type: string
        timezone:
          type: string
          description: Trusted selected-school IANA timezone for appointment wall times; optional for
            older servers.
    WellbeingConfiguration:
      type: object
      additionalProperties: false
      required:
      - professional_choices
      - professionals_last_page
      - learner_choices
      - learners_last_page
      - categories
      - categories_last_page
      - page
      properties:
        professional_choices:
          type: array
          items:
            $ref: '#/components/schemas/WellbeingNamedChoice'
        professionals_last_page:
          type: integer
          minimum: 1
        learner_choices:
          type: array
          items:
            $ref: '#/components/schemas/WellbeingLearnerChoice'
        learners_last_page:
          type: integer
          minimum: 1
        categories:
          type: array
          items:
            $ref: '#/components/schemas/WellbeingCategory'
        categories_last_page:
          type: integer
          minimum: 1
        page:
          type: integer
          minimum: 1
    IncidentPublicConfiguration:
      type: object
      additionalProperties: false
      required:
      - emergency_guidance
      - categories
      properties:
        emergency_guidance:
          type: string
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - name
            - emergency_guidance
            properties:
              id:
                type: integer
                minimum: 1
              name:
                type: string
              emergency_guidance:
                type: string
    IncidentSubmissionReceipt:
      type: object
      additionalProperties: false
      required:
      - received
      - submitted_at
      - emergency_guidance
      properties:
        received:
          type: boolean
        submitted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        emergency_guidance:
          type: string
    IncidentReplyReceipt:
      type: object
      additionalProperties: false
      required:
      - posted
      - operation_id
      - created_at
      properties:
        posted:
          type: boolean
