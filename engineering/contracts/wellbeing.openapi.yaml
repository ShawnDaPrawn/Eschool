paths:
  /wellbeing/public/{schoolSlug}/configuration:
    get:
      operationId: getPublicIncidentConfiguration
      tags:
      - Wellbeing
      summary: getPublicIncidentConfiguration
      description: 'Stateless anonymous reporting: no authenticated cookie or reporter identity is consulted.
        A private 256-bit code is sent only in POST bodies; store no raw code or reporter/device/network
        identifier with a report. Identified reports require their named freshly authorized reporter through
        the authenticated endpoint. Keyed short-lived abuse counters are separate from records. Emergency
        guidance is always returned; this is not an emergency response service.'
      responses:
        '200':
          description: Private scoped wellbeing result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPublicIncidentConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: schoolSlug
        in: path
        required: true
        schema:
          type: string
          maxLength: 191
          pattern: ^[a-z0-9][a-z0-9-]*$
      security: []
