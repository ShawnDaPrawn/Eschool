tags:
- name: SecureCards
  description: Private school identity cards and isolated online gate readers.
paths:
  /cards/configuration:
    get:
      operationId: getSecureCardConfiguration
      tags:
      - SecureCards
      summary: getSecureCardConfiguration
      description: Current school/person/card authority is checked on every read and operation replay. Device credentials
        are isolated from user authentication. Online scanning only; offline, encoding and classroom workflows are
        separate.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      responses:
        '200':
          description: Authorized private card result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecureCardConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
