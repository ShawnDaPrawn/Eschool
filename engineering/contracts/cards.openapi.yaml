components:
  securitySchemes:
    CardDeviceCredential:
      type: http
      scheme: bearer
      bearerFormat: NED1
      description: A delegated expiring school-bound reader credential; never a user token.
  schemas:
    SecureCard:
      type: object
      additionalProperties: false
      required:
      - id
      - school_id
      - person_id
      - type
      - status
      - revision
      - issued_at
      - frozen_at
      - replaced_by
      - has_chip
      properties:
        id:
          type: string
          format: uuid
        school_id:
          type: integer
          minimum: 1
        person_id:
          type: integer
          minimum: 1
        type:
          type: string
          pattern: ^(learner|staff|guardian)$
        status:
          type: string
          pattern: ^(active|frozen|replaced)$
        revision:
          type: integer
          minimum: 1
        issued_at:
          type: string
          format: date-time
        frozen_at:
          type:
          - string
          - 'null'
          format: date-time
        replaced_by:
          type:
          - string
          - 'null'
          format: uuid
        has_chip:
          type: boolean
    SecureCardConfiguration:
      type: object
      additionalProperties: false
      required:
      - can_manage
      - can_manage_readers
      - writable
      - types
      properties:
        can_manage:
          type: boolean
        can_manage_readers:
          type: boolean
        writable:
          type: boolean
        types:
          type: array
          items:
            type: string
    SecureCardPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SecureCard'
        next_page:
          type:
          - integer
          - 'null'
          minimum: 1
    SecureCardPerson:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - type
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        type:
          type: string
    SecureCardPeoplePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SecureCardPerson'
        next_page:
          type:
          - integer
          - 'null'
          minimum: 1
    SecureCardCredential:
      type: object
      additionalProperties: false
      required:
      - card
      - credential
      - expires_at
      - key_id
      - public_key
      properties:
        card:
          $ref: '#/components/schemas/SecureCard'
        credential:
          type: string
          maxLength: 1024
        expires_at:
          type: string
          format: date-time
        key_id:
          type: string
          format: uuid
        public_key:
          type: string
          maxLength: 64
    SecureCardIssue:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - person_id
      - type
      properties:
        operation_id:
          type: string
          format: uuid
        person_id:
          type: integer
          minimum: 1
        type:
          type: string
          pattern: ^(learner|staff|guardian)$
    SecureCardPortraitUpload:
      type: object
      additionalProperties: false
      required:
      - operation_id
