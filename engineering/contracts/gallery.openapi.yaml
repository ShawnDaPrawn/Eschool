tags:
- name: Gallery
  description: Private family photo history, consent and current activity sources.
paths:
  /gallery/configuration:
    get:
      operationId: getGalleryConfiguration
      tags:
      - Gallery
      summary: getGalleryConfiguration
      description: Private owned family history or explicitly authorized current activity source. Guardian-first
        consent, current account/school/module and ownership are rechecked before replay or pixels. No storage paths,
        other learner tags or public image URLs. Query booleans accept true/false or 1/0.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/ExpectedAccount'
      responses:
        '200':
          description: Authorized private projection or JPEG pixels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /gallery/learners/{learner}/photos:
