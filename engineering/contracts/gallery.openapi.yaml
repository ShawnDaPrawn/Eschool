      - $ref: '#/components/parameters/ExpectedAccount'
      - name: learner
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: pending
        in: query
        required: false
        schema:
          type: boolean
      - name: before
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: session_year_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Authorized private projection or JPEG pixels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryFamilyPageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
