# Local stack that mirrors Cloud Run: MySQL 8, the panel (web role), the queue
# worker and the scheduler, all from admin-panel/Dockerfile. Instructions:
# wiki/Getting-Started.md ("Option C: Docker Compose").
#
#   1. Create .env next to this file (git ignores it) with at least:
#        APP_KEY=base64:<32 random bytes, base64>   (openssl rand -base64 32)
#        ADMIN_PASSWORD=<a password for the panel's admin>
#   2. docker compose up --build
#   3. Open http://localhost:8080/login as ADMIN_EMAIL / ADMIN_PASSWORD.
#
# Not for production: the database password defaults to a local-only value and
# MySQL's port is published on 127.0.0.1 for database tools.

name: navigateed

x-panel: &panel
  build:
    context: ./admin-panel
    args:
      APP_RELEASE: local
  image: navigateed-admin:local
  restart: unless-stopped
  volumes:
    # Uploads, shared by the three roles as the Cloud Storage bucket is on Cloud Run.
    - storage:/var/www/html/storage/app
  environment: &panel-env
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env next to docker-compose.yml (see wiki/Getting-Started.md)}
    APP_URL: ${APP_URL:-http://localhost:8080}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@navigateed.local}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env next to docker-compose.yml}
    TIMEZONE: Africa/Johannesburg
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: navigateed
    DB_USERNAME: navigateed
    DB_PASSWORD: ${DB_PASSWORD:-local-only-password}
    # Shared stores, as on Cloud Run: the scheduler's overlap locks and the rate
    # limits must be visible to every container.
    CACHE_DRIVER: database
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
    LOG_CHANNEL: ${LOG_CHANNEL:-json}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    MAIL_MAILER: log

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: navigateed
      MYSQL_USER: navigateed
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-only-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-only-root-password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The panel, API and public pages. Migrates the database on start.
  web:
    <<: *panel
    environment:
      <<: *panel-env
      CONTAINER_ROLE: web
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # php artisan queue:work, restarted when it exits. Starts once web has migrated.
  worker:
    <<: *panel
    environment:
      <<: *panel-env
      CONTAINER_ROLE: worker
    depends_on:
      web:
        condition: service_healthy

  # php artisan schedule:work: runs routes/console.php every minute, as Cloud
  # Scheduler and the navigateed-scheduler job do on Cloud Run.
  scheduler:
    <<: *panel
    environment:
      <<: *panel-env
      CONTAINER_ROLE: scheduler-loop
    depends_on:
      web:
        condition: service_healthy

  # Phase 2: the content converter (Python, MarkItDown), called by a queued job.
  # converter:
  #   build:
  #     context: ./converter
  #   image: navigateed-converter:local
  #   restart: unless-stopped
  #   environment:
  #     PORT: "8090"
  #   ports:
  #     - "127.0.0.1:8090:8090"

volumes:
  mysql:
  storage:
