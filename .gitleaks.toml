# Secret scanning for this repository: gitleaks over the whole git history, in
# .github/workflows/security.yml. gitleaks' default rules all apply.
#
# The allowlist below holds only findings proven to be false positives, each
# with the reason and where it was found. A new finding fails CI: if it is a
# real secret, rotate it first, then remove it from the code and record it in
# engineering/security/phase-N.md; never allowlist a real secret.

title = "NavigateEd gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Firebase Android client configuration (google-services.json)"
# api_key.current_key in these files is the Firebase Android API key of project
# navigateed-d8c06: a public identifier compiled into every APK, not a
# credential (https://firebase.google.com/docs/projects/api-keys). Access is
# governed by Firebase security rules and the key's application and API
# restrictions in the Cloud Console. Added in commit 1103e37e99 ("Connect the
# apps to Firebase project navigateed-d8c06"): the two current_key lines in
# each file, reported by both rules below. Only values in the Firebase API key
# format, and only in these two files, are allowed (condition AND).
targetRules = ["gcp-api-key", "generic-api-key"]
condition = "AND"
paths = [
  '''^e-school/android/app/google-services\.json$''',
  '''^e-school-teacher/android/app/google-services\.json$''',
]
regexTarget = "secret"
regexes = ['''^AIza[0-9A-Za-z_\-]{35}$''']
