name: Deploy environment

# Shared by deploy-staging.yml and deploy-production.yml: builds the panel
# image, pushes it to Artifact Registry, deploys the web service, the worker
# and the scheduler job, deploys the Firebase Hosting sites (docs and, once the
# web builds exist, the portals), then smoke-tests the result.
#
# Everything it needs comes from the GitHub environment named by the caller
# (Settings > Environments): see engineering/runbooks/environments.md for the
# variables and secrets, and infra/gcp/provision.sh, which creates what this
# workflow deploys to. It authenticates with Workload Identity Federation; no
# key is stored in GitHub.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy (staging or production)
        type: string
        required: true
      release:
        description: Release name for the image and the logs (a v* tag or a commit)
        type: string
        required: true
      backup:
        description: Take an on-demand Cloud SQL backup before deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.urls.outputs.panel }}
    permissions:
      contents: read
      id-token: write
    outputs:
      panel_url: ${{ steps.urls.outputs.panel }}
      portal_urls: ${{ steps.urls.outputs.portals }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      RELEASE: ${{ inputs.release }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'africa-south1' }}
      REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'navigateed' }}
      SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE || 'navigateed-mysql' }}
      SERVICE_ADMIN: navigateed-admin
      SERVICE_WORKER: navigateed-worker
      JOB_SCHEDULER: navigateed-scheduler
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || vars.GCP_PROJECT_ID }}
    steps:
      - name: Check the environment is configured
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
        run: |
          missing=()
          [ -n "$PROJECT_ID" ] || missing+=("variable GCP_PROJECT_ID")
          [ -n "$WIF_PROVIDER" ] || missing+=("secret GCP_WIF_PROVIDER")
          [ -n "$DEPLOY_SA" ] || missing+=("secret GCP_DEPLOY_SA")
          if [ ${#missing[@]} -gt 0 ]; then
            for item in "${missing[@]}"; do
              echo "::error::The GitHub environment '$ENVIRONMENT' has no $item (engineering/runbooks/environments.md)."
            done
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '570.0.0'

      - name: Back up the database
        if: inputs.backup
        run: |
          gcloud sql backups create --instance="$SQL_INSTANCE" --project="$PROJECT_ID" \
            --description="Before release $RELEASE (run $GITHUB_RUN_ID)"
          gcloud sql backups list --instance="$SQL_INSTANCE" --project="$PROJECT_ID" --limit=1 \
            --format='table(id,windowStartTime,type,status)'

      - name: Build and push the image
        id: image
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/admin-panel"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --pull --build-arg APP_RELEASE="$RELEASE" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$image:$GITHUB_SHA" admin-panel
          docker push "$image:$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag "$image:$GITHUB_SHA" "$image:$GITHUB_REF_NAME"
            docker push "$image:$GITHUB_REF_NAME"
          fi
          # Deploy by digest: the revision runs exactly what was just pushed.
          ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$GITHUB_SHA")"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Image: $ref" >> "$GITHUB_STEP_SUMMARY"

      # The web role migrates on start; Cloud Run moves traffic to the new
      # revision only once it is ready, so the old one serves until then.
      - name: Deploy the panel (navigateed-admin)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: gcloud run deploy "$SERVICE_ADMIN" --image="$IMAGE" --region="$REGION" --project="$PROJECT_ID" --quiet

      - name: Deploy the worker (navigateed-worker)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: gcloud run deploy "$SERVICE_WORKER" --image="$IMAGE" --region="$REGION" --project="$PROJECT_ID" --quiet

      - name: Update the scheduler job (navigateed-scheduler)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: gcloud run jobs update "$JOB_SCHEDULER" --image="$IMAGE" --region="$REGION" --project="$PROJECT_ID" --quiet

      - name: Work out the addresses
        id: urls
        env:
          PANEL_URL: ${{ vars.PANEL_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          APP_PORTAL_URL: ${{ vars.APP_PORTAL_URL }}
          TEACH_PORTAL_URL: ${{ vars.TEACH_PORTAL_URL }}
          WEB_AUTH_MODE: ${{ vars.WEB_AUTH_MODE }}
        run: |
          panel="${PANEL_URL:-$(gcloud run services describe "$SERVICE_ADMIN" --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)')}"
          api="${API_BASE_URL:-${panel%/}}"
          # The portals sign in with the session cookie when the API is under
          # navigateed.co.za with them (provision.sh then sets SESSION_DOMAIN);
          # on the run.app address they use bearer tokens. WEB_AUTH_MODE
          # (cookie or bearer) overrides.
          api_host="${api#https://}"
          api_host="${api_host%%/*}"
          mode="$WEB_AUTH_MODE"
          if [ -z "$mode" ]; then
            case "$api_host" in
              *.navigateed.co.za) mode=cookie ;;
              *) mode=bearer ;;
            esac
          fi
          {
            echo "panel=${panel%/}"
            echo "api=$api"
            echo "portals=$APP_PORTAL_URL $TEACH_PORTAL_URL"
            echo "web_auth_mode=$mode"
          } >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: hashFiles('e-school/web/index.html', 'e-school-teacher/web/index.html') != ''
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # Staging and production builds differ only by these defines (ADR 0003).
      - name: Build the web portals
        if: hashFiles('e-school/web/index.html', 'e-school-teacher/web/index.html') != ''
        env:
          API_BASE_URL: ${{ steps.urls.outputs.api }}
          WEB_AUTH_MODE: ${{ steps.urls.outputs.web_auth_mode }}
        run: |
          for app in e-school e-school-teacher; do
            [ -f "$app/web/index.html" ] || continue
            flavor=learner
            [ "$app" = e-school-teacher ] && flavor=teacher
            (
              cd "$app"
              flutter pub get --enforce-lockfile
              flutter build web --release \
                --dart-define=API_BASE_URL="$API_BASE_URL" \
                --dart-define=ENV="$ENVIRONMENT" \
                --dart-define=FLAVOR="$flavor" \
                --dart-define=WEB_AUTH_MODE="$WEB_AUTH_MODE"
            )
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: documentation/package-lock.json

      - name: Deploy Firebase Hosting (docs and portals)
        env:
          FIREBASE_SITE_DOCS: ${{ vars.FIREBASE_SITE_DOCS }}
          FIREBASE_SITE_APP: ${{ vars.FIREBASE_SITE_APP }}
          FIREBASE_SITE_TEACH: ${{ vars.FIREBASE_SITE_TEACH }}
        run: |
          npm install --global --no-audit --no-fund firebase-tools@15.32.1
          infra/firebase/deploy-hosting.sh "$FIREBASE_PROJECT_ID" "$ENVIRONMENT $RELEASE"

  smoke:
    name: Smoke test (${{ inputs.environment }})
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Panel, API, worker and portals answer
        env:
          PANEL_URL: ${{ needs.deploy.outputs.panel_url }}
          PORTAL_URLS: ${{ needs.deploy.outputs.portal_urls }}
        run: |
          # shellcheck disable=SC2086 # one argument per portal address
          infra/deploy/smoke.sh "$PANEL_URL" $PORTAL_URLS
