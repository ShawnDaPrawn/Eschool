name: Temporary Windows app qualification
'on':
  push:
    branches:
    - verification/flutter-windows-full-20261109
permissions:
  contents: read
concurrency:
  group: verification-flutter-windows-full-20261109
  cancel-in-progress: true
jobs:
  apps:
    name: Flutter package (${{ matrix.app }})
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.app }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Verify app code matches the reviewed integration
      working-directory: .
      run: git diff --exit-code cab9d172b5b4183df44e4f3745489a13950c11dc HEAD -- . ':(exclude).github/workflows/temporary-flutter-verification.yml'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.7
        channel: stable
        cache: false
    - run: flutter pub get --enforce-lockfile
    - run: flutter analyze --no-fatal-infos
    - run: flutter test
    - name: Verify source and lockfiles remain unchanged
      working-directory: .
      run: git diff --exit-code -- . ':(exclude).github/workflows/temporary-flutter-verification.yml'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app:
        - e-school
        - e-school-teacher
        - packages/eschool_core
        - packages/eschool_api
        - packages/eschool_session
        - packages/eschool_notifications
        - packages/eschool_people
        - packages/eschool_features/academics
        - packages/eschool_features/fees
        - packages/eschool_features/wallet
  web:
    name: Flutter web build (${{ matrix.app }})
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.app }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Verify app code matches the reviewed integration
      working-directory: .
      run: git diff --exit-code cab9d172b5b4183df44e4f3745489a13950c11dc HEAD -- . ':(exclude).github/workflows/temporary-flutter-verification.yml'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.7
        channel: stable
        cache: false
    - run: flutter pub get --enforce-lockfile
    - run: flutter build web --release --dart-define-from-file=config/staging.json
    - name: Verify source and lockfiles remain unchanged
      working-directory: .
      run: git diff --exit-code -- . ':(exclude).github/workflows/temporary-flutter-verification.yml'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app:
        - e-school
        - e-school-teacher
  android:
    name: Android debug build (${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.app }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Verify app code matches the reviewed integration
      working-directory: .
      run: git diff --exit-code cab9d172b5b4183df44e4f3745489a13950c11dc HEAD -- . ':(exclude).github/workflows/temporary-flutter-verification.yml'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.7
        channel: stable
        cache: false
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
    - run: flutter pub get --enforce-lockfile
    - run: flutter build apk --debug --dart-define-from-file=config/staging.json ${{ matrix.args }}
    - name: Verify source and lockfiles remain unchanged
      working-directory: .
      run: git diff --exit-code -- . ':(exclude).github/workflows/temporary-flutter-verification.yml'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - app: e-school
          profile: family
          args: ''
        - app: e-school-teacher
          profile: teacher
          args: --flavor teacher --dart-define=FLAVOR=teacher
        - app: e-school-teacher
          profile: facilitator
          args: --flavor facilitator --dart-define=FLAVOR=facilitator
        - app: e-school-teacher
          profile: vendor
          args: --flavor vendor --dart-define=FLAVOR=vendor
  browser:
    name: Chrome profile flow (${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.app }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Verify app code matches the reviewed integration
      working-directory: .
      run: git diff --exit-code cab9d172b5b4183df44e4f3745489a13950c11dc HEAD -- . ':(exclude).github/workflows/temporary-flutter-verification.yml'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.7
        channel: stable
        cache: false
    - run: flutter pub get --enforce-lockfile
    - name: Start the installed matching Chrome driver
      shell: pwsh
      run: '$driver = if ($env:CHROMEWEBDRIVER) { Join-Path $env:CHROMEWEBDRIVER ''chromedriver.exe'' } else { (Get-Command
        chromedriver.exe -ErrorAction Stop).Source }

        Start-Process -FilePath $driver -ArgumentList ''--port=4444'' -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP
        ''chromedriver.log'') -RedirectStandardError (Join-Path $env:RUNNER_TEMP ''chromedriver-error.log'')

        Start-Sleep -Seconds 2

        Invoke-RestMethod http://127.0.0.1:4444/status | ConvertTo-Json -Depth 4'
    - run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/${{ matrix.flow }} ${{ matrix.args
        }} -d web-server --browser-name=chrome --headless --no-web-resources-cdn
    - name: Verify source and lockfiles remain unchanged
      working-directory: .
      run: git diff --exit-code -- . ':(exclude).github/workflows/temporary-flutter-verification.yml'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - app: e-school
          profile: family
          args: ''
          flow: family_messages_smoke_test.dart
        - app: e-school-teacher
          profile: teacher
          args: --flavor teacher --dart-define=FLAVOR=teacher
          flow: teacher_smoke_test.dart
        - app: e-school-teacher
          profile: facilitator
          args: --flavor facilitator --dart-define=FLAVOR=facilitator
          flow: facilitator_smoke_test.dart
        - app: e-school-teacher
          profile: vendor
          args: --flavor vendor --dart-define=FLAVOR=vendor
          flow: vendor_smoke_test.dart
