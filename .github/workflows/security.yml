name: Security

# Secret scanning over the whole git history (Build Bible 5.1 and Phase 0
# step 7). The dependency audits (composer audit, npm audit, dart pub
# outdated) run in ci.yml's security-audit job; Dependabot is configured in
# .github/dependabot.yml. Findings and their status: engineering/security/.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a rule added to gitleaks' defaults is applied to old commits too.
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks, whole history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
          gitleaks version

      # Every commit reachable from any branch or tag. Allowlisted false
      # positives are in .gitleaks.toml, each with its reason. Values are
      # redacted in the output and the report.
      - name: Scan the history
        run: |
          gitleaks git --log-opts="--all" --config .gitleaks.toml --redact \
            --report-format sarif --report-path gitleaks.sarif --no-banner --verbose

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 14
