name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published security advisories show up even without pushes.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converter:
    name: Private academic content converter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/converter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned conversion and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --require-hashes -r requirements-dev.txt
      - name: Audit the resolved production Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/converter-audit"
          "$RUNNER_TEMP/converter-audit/bin/pip" install pip-audit==2.10.1
          "$RUNNER_TEMP/converter-audit/bin/pip-audit" --disable-pip --no-deps -r requirements.txt
      - name: Fetch and verify the offline model at its pinned revision
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python tool/download_model.py --path "$RUNNER_TEMP/converter-models/base"
      - name: Convert actual PDF, Word, slides, audio and video and check boundaries
        env:
          TRANSCRIPTION_MODEL_PATH: ${{ runner.temp }}/converter-models/base
        run: python -m pytest
      - name: Build the private runtime
        run: docker build --pull -t navigateed-converter-check .
      - name: Verify authenticated ingress and a read-only offline runtime
        run: |
          docker run --detach --name converter-check --read-only --network none \
            --tmpfs /tmp:rw,noexec,nosuid,size=192m,mode=1777 \
            -e CONVERTER_SERVICE_TOKEN=test-only-converter-token-never-used-outside-ci \
            -e CONVERTER_SOURCE_ORIGIN=https://backend.example navigateed-converter-check
          python tool/runtime_fixtures.py "$RUNNER_TEMP/converter-smoke"
          tar -C "$RUNNER_TEMP/converter-smoke" -cf - . | docker exec -i converter-check sh -c 'mkdir -p /tmp/smoke-inputs && tar -xf - -C /tmp/smoke-inputs'
          docker exec -i converter-check python - < tool/runtime_smoke.py
      - name: Remove the disposable runtime
        if: always()
        run: docker rm --force converter-check || true

  php-runtime:
    name: Patched PHP container runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the shared web, worker and scheduler image
        run: docker build --pull -t navigateed-php-check admin-panel
      - name: Verify PHP2Shell patch level and required extensions
        run: |
          docker run --rm --entrypoint php navigateed-php-check -r \
            'echo PHP_VERSION, PHP_EOL; exit(PHP_VERSION_ID >= 80336 && PHP_VERSION_ID < 80400 ? 0 : 1);'
          docker run --rm --entrypoint composer navigateed-php-check check-platform-reqs --no-dev
      - name: Verify Apache configuration
        run: docker run --rm --entrypoint apache2ctl navigateed-php-check configtest

  admin-panel:
    name: Admin panel (PHP tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eschool_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: eschool_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: mbstring, intl, gd, zip, sodium, pdo_mysql, bcmath, exif, fileinfo
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate --force
      - name: Routes load
        run: php artisan route:list > /dev/null
      # The whole panel is formatted with Pint's laravel preset (pint.json); unformatted code fails.
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      # Errors from before static analysis are listed in phpstan-baseline.neon; new ones fail.
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress
      # Production installs can run php artisan optimize; every cache must build.
      - name: Config, routes and views cache
        run: php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan optimize:clear
      - name: Verify real ClamAV clean and EICAR results with current definitions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav-daemon clamav-freshclam
          sudo systemctl stop clamav-freshclam clamav-daemon || true
          sudo freshclam --quiet
          cat > "$RUNNER_TEMP/content-clamd.conf" <<'CLAMD'
          DatabaseDirectory /var/lib/clamav
          TCPSocket 3310
          TCPAddr 127.0.0.1
          User clamav
          Foreground no
          LogFile /tmp/content-clamd.log
          StreamMaxLength 30M
          CLAMD
          sudo clamd --config-file="$RUNNER_TEMP/content-clamd.conf"
          for attempt in $(seq 1 60); do
            if php -r '$s=@stream_socket_client("tcp://127.0.0.1:3310", $e, $m, 1); if (!$s) { exit(1); } fwrite($s,"zPING\0"); exit(fread($s,16)==="PONG\0" ? 0 : 1);'; then break; fi
            sleep 2
          done
          CONTENT_CLAMAV_INTEGRATION=true php artisan test tests/Unit/ClamAvIntegrationTest.php
      - run: php artisan test
      # The container's Apache answers the portals' requests for uploaded files
      # with CORS headers (docker/storage-cors.conf); the runner has apache2.
      - name: Storage CORS in Apache
        run: bash docker/tests/storage-cors.sh

  openapi:
    name: OpenAPI contract (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # admin-panel/openapi.yaml is the API v2 contract. redocly.yaml sets the
      # rules (recommended-strict): any warning fails. The responses are checked
      # against it by tests/Feature/Contracts in the admin-panel job.
      - run: npx --yes @redocly/cli@2.57.0 lint openapi.yaml

  apps:
    name: Flutter app (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [e-school, e-school-teacher, packages/eschool_core, packages/eschool_api, packages/eschool_session, packages/eschool_notifications, packages/eschool_people, packages/eschool_features/academics]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # packages/eschool_api is generated from admin-panel/openapi.yaml: regenerate
      # it and fail if the committed code differs (or files were added or removed).
      - if: matrix.app == 'packages/eschool_api'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.app == 'packages/eschool_api'
        name: Generated client matches openapi.yaml
        run: |
          tool/generate.sh
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --short -- .
            git diff -- . | head -200
            echo "::error::packages/eschool_api is out of date: run packages/eschool_api/tool/generate.sh and commit the result"
            exit 1
          fi
      # Style-only "info" lints are reported but don't fail the build; errors and warnings do.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  apps-web:
    name: Flutter web build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [e-school, e-school-teacher]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # The same build the deploy workflow makes, with the staging settings.
      - run: flutter build web --release --dart-define-from-file=config/staging.json

  # The integration_test/ smoke flows (sign in, reach Home, open a screen)
  # against the fake API in integration_test/support/fixtures.dart: no server.
  apps-smoke-android:
    name: Flutter smoke flows on Android (${{ matrix.app }} ${{ matrix.flavor }})
    # Pin the emulator host while ubuntu-latest migrates to Ubuntu 26.
    # Android SDK and KVM availability must not change under a release.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: e-school
            flavor: family
            command: flutter test integration_test
          - app: e-school-teacher
            flavor: teacher
            command: flutter test $(find integration_test -maxdepth 1 -name '*_test.dart' ! -name 'facilitator*_test.dart' | sort)
          - app: e-school-teacher
            flavor: facilitator
            command: flutter test --flavor facilitator --dart-define=FLAVOR=facilitator integration_test/facilitator*_test.dart
    steps:
      - uses: actions/checkout@v7
      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: ${{ matrix.app }}
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: ${{ matrix.app }}
          script: ${{ matrix.command }}

  apps-smoke-chrome:
    name: Flutter smoke flow in Chrome (${{ matrix.flow }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: e-school
            flow: learner_smoke_test.dart
          - app: e-school
            flow: parent_smoke_test.dart
          - app: e-school
            flow: child_switch_smoke_test.dart
          - app: e-school
            flow: notification_settings_smoke_test.dart
          - app: e-school
            flow: my_school_smoke_test.dart
          - app: e-school
            flow: profile_smoke_test.dart
          - app: e-school
            flow: handles_smoke_test.dart
          - app: e-school
            flow: exam_math_smoke_test.dart
          - app: e-school-teacher
            flow: teacher_smoke_test.dart
          - app: e-school-teacher
            flow: teacher_academic_marks_smoke_test.dart
          - app: e-school
            flow: family_academic_marks_smoke_test.dart
          - app: e-school-teacher
            flow: teacher_timetable_smoke_test.dart
          - app: e-school
            flow: family_timetable_smoke_test.dart
          - app: e-school-teacher
            flow: teacher_register_smoke_test.dart
          - app: e-school-teacher
            flow: teacher_reports_smoke_test.dart
          - app: e-school
            flow: family_register_smoke_test.dart
          - app: e-school
            flow: family_reports_smoke_test.dart
          - app: e-school
            flow: family_content_smoke_test.dart
          - app: e-school-teacher
            flow: teacher_content_smoke_test.dart
          - app: e-school
            flow: family_messages_smoke_test.dart
          - app: e-school-teacher
            flow: teacher_messages_smoke_test.dart
          - app: e-school
            flow: family_mastery_smoke_test.dart
          - app: e-school-teacher
            flow: teacher_mastery_smoke_test.dart
          - app: e-school-teacher
            flow: teacher_cover_smoke_test.dart
          - app: e-school-teacher
            flow: facilitator_support_smoke_test.dart
            flavor: facilitator
          - app: e-school-teacher
            flow: facilitator_wellbeing_smoke_test.dart
            flavor: facilitator
          - app: e-school
            flow: family_progress_smoke_test.dart
          - app: e-school
            flow: family_reporting_smoke_test.dart
          - app: e-school
            flow: parent_transfers_smoke_test.dart
          - app: e-school-teacher
            flow: teacher_notes_smoke_test.dart
          - app: e-school-teacher
            flow: teacher_wellbeing_smoke_test.dart
          - app: e-school-teacher
            flow: facilitator_notes_smoke_test.dart
            flavor: facilitator
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # The runner image ships Chrome with a matching chromedriver.
      - name: Start chromedriver
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          sleep 2
      - run: >-
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/${{ matrix.flow }}
          ${{ matrix.flavor && format('--flavor {0} --dart-define=FLAVOR={0}', matrix.flavor) || '' }}
          -d web-server --browser-name=chrome --headless
          --no-web-resources-cdn

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documentation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - run: npm ci
      # onBrokenLinks is 'throw', so this also fails on any broken link.
      - run: npm run build

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          coverage: none
      - name: PHP packages (fails on any advisory)
        working-directory: admin-panel
        run: composer audit --locked
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      # Informational (Bible 5.1): lists outdated Dart packages in both apps and
      # every package; never fails the build. Dependabot opens the update PRs.
      - name: Dart packages (informational)
        continue-on-error: true
        run: |
          for dir in e-school e-school-teacher packages/*/; do
            dir="${dir%/}"
            [ -f "$dir/pubspec.yaml" ] || continue
            echo "::group::dart pub outdated: $dir"
            (cd "$dir" && flutter pub get --enforce-lockfile > /dev/null && dart pub outdated) \
              || echo "::warning::dart pub outdated could not run in $dir"
            echo "::endgroup::"
          done
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Documentation build tools (fails on critical)
        working-directory: documentation
        run: npm audit --audit-level=critical

  playwright:
    name: Admin panel (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eschool_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: eschool_e2e
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: mbstring, intl, gd, zip, sodium, pdo_mysql, bcmath, exif, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate --force
      - name: Database with the demo school
        run: |
          php artisan migrate --force
          php artisan db:seed --class=InstallationSeeder --force
          php artisan db:seed --class=DemoSchoolSeeder --force
          php artisan storage:link
      # The array cache keeps the panel's per-account request limits from
      # throttling the page sweep; four workers serve the parallel browsers.
      - name: Start the panel
        run: |
          PHP_CLI_SERVER_WORKERS=4 CACHE_DRIVER=array nohup php artisan serve --no-reload --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/login && exit 0; sleep 1; done
          cat storage/logs/serve.log
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-panel/e2e/package-lock.json
      - name: Install Playwright
        working-directory: admin-panel/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright checks
        working-directory: admin-panel/e2e
        run: npm run typecheck && npx playwright test
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            admin-panel/e2e/playwright-report/
            admin-panel/e2e/test-results/
            admin-panel/storage/logs/
          retention-days: 14
