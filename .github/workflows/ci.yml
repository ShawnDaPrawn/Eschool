name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published security advisories show up even without pushes.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-panel:
    name: Admin panel (PHP tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eschool_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: eschool_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_mysql, bcmath, exif, fileinfo
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate --force
      - name: Routes load
        run: php artisan route:list > /dev/null
      # Errors from before static analysis are listed in phpstan-baseline.neon; new ones fail.
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress
      # Production installs can run php artisan optimize; every cache must build.
      - name: Config, routes and views cache
        run: php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan optimize:clear
      - run: php artisan test

  apps:
    name: Flutter app (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [e-school, e-school-teacher, packages/eschool_core]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Style-only "info" lints are reported but don't fail the build; errors and warnings do.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documentation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - run: npm ci
      # onBrokenLinks is 'throw', so this also fails on any broken link.
      - run: npm run build

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP packages (fails on any advisory)
        working-directory: admin-panel
        run: composer audit --locked
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      # Informational (Bible 5.1): lists outdated Dart packages in both apps and
      # every package; never fails the build. Dependabot opens the update PRs.
      - name: Dart packages (informational)
        continue-on-error: true
        run: |
          for dir in e-school e-school-teacher packages/*/; do
            dir="${dir%/}"
            [ -f "$dir/pubspec.yaml" ] || continue
            echo "::group::dart pub outdated: $dir"
            (cd "$dir" && flutter pub get --enforce-lockfile > /dev/null && dart pub outdated) \
              || echo "::warning::dart pub outdated could not run in $dir"
            echo "::endgroup::"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Documentation build tools (fails on critical)
        working-directory: documentation
        run: npm audit --audit-level=critical
