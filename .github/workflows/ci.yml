name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published security advisories show up even without pushes.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-panel:
    name: Admin panel (PHP tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eschool_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: eschool_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_mysql, bcmath, exif, fileinfo
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate --force
      - name: Routes load
        run: php artisan route:list > /dev/null
      # Errors from before static analysis are listed in phpstan-baseline.neon; new ones fail.
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress
      # Production installs can run php artisan optimize; every cache must build.
      - name: Config, routes and views cache
        run: php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan optimize:clear
      - run: php artisan test

  apps:
    name: Flutter app (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [e-school, e-school-teacher, packages/eschool_core, packages/eschool_session, packages/eschool_notifications]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Style-only "info" lints are reported but don't fail the build; errors and warnings do.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  apps-web:
    name: Flutter web build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [e-school, e-school-teacher]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # The same build the deploy workflow makes, with the staging settings.
      - run: flutter build web --release --dart-define-from-file=config/staging.json

  # The integration_test/ smoke flows (sign in, land on home, open one screen)
  # against the fake API in integration_test/support/fixtures.dart: no server.
  apps-smoke-android:
    name: Flutter smoke flows on Android (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [e-school, e-school-teacher]
    steps:
      - uses: actions/checkout@v4
      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: ${{ matrix.app }}
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: ${{ matrix.app }}
          script: flutter test integration_test

  apps-smoke-chrome:
    name: Flutter smoke flow in Chrome (${{ matrix.flow }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: e-school
            flow: learner_smoke_test.dart
          - app: e-school
            flow: parent_smoke_test.dart
          - app: e-school-teacher
            flow: teacher_smoke_test.dart
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # The runner image ships Chrome with a matching chromedriver.
      - name: Start chromedriver
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          sleep 2
      - run: >-
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/${{ matrix.flow }}
          -d web-server --browser-name=chrome --headless
          --no-web-resources-cdn

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documentation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - run: npm ci
      # onBrokenLinks is 'throw', so this also fails on any broken link.
      - run: npm run build

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP packages (fails on any advisory)
        working-directory: admin-panel
        run: composer audit --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Documentation build tools (fails on critical)
        working-directory: documentation
        run: npm audit --audit-level=critical
