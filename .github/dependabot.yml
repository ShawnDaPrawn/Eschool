# Dependabot version updates for every project in the repository (Build Bible
# 5.1: "Dependabot on all four projects"). Security updates are switched on in
# Settings > Code security. Minor and patch updates are grouped into one pull
# request per ecosystem a week; majors come one by one. Each pull request runs
# CI like any other and is merged only when green.

version: 2

updates:
  # Laravel panel and API.
  - package-ecosystem: composer
    directory: /admin-panel
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      composer-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Both Flutter apps and every shared package under packages/.
  - package-ecosystem: pub
    directories:
      - /e-school
      - /e-school-teacher
      - /packages/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

    # flutter_html 3.0.0 still imports html's removed private matches() API.
    # Remove this exception when that consumer has a compatible release.
    ignore:
      - dependency-name: html
        versions: [">=0.15.7"]

  # Documentation site, and the panel's Playwright project.
  - package-ecosystem: npm
    directories:
      - /documentation
      - /admin-panel/e2e
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images of admin-panel/Dockerfile (php, composer).
  - package-ecosystem: docker
    directory: /admin-panel
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 2
    # The panel and CI qualify PHP 8.3; retain patch/security updates there.
    ignore:
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Actions in .github/workflows, including the commit-pinned ones.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
