name: eschool_core
description: Code shared by the eSchool student/parent app and the eSchool teacher app.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.0.0
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  dotted_border: ^3.1.0
  equatable: ^2.0.8
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_html: ^3.0.0
  flutter_pdfview: ^1.4.4
  flutter_svg: ^2.2.4
  # Not used directly: flutter_html 3.0.0 calls matches() from html's
  # src/query_selector.dart, which html 0.15.7 removed, so neither app
  # compiled with 0.15.7. Lift this when flutter_html no longer needs it.
  html: ">=0.15.4 <0.15.7"
  intl: any
  lottie: ^3.3.3
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  # The PDF view of web builds; phones keep flutter_pdfview.
  pdfx: ^2.11.0
  shimmer: ^3.0.0
  timeago: ^3.7.1
  web: ^1.1.1
  webview_flutter: ^4.13.1
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
