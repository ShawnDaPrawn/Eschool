name: eschool_people
description: The people screens both NavigateEd apps share - guardian approvals, invitations, My school and the avatar picker.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  equatable: ^2.0.8
  eschool_api:
    path: ../eschool_api
  eschool_core:
    path: ../eschool_core
  eschool_session:
    path: ../eschool_session
  flutter_bloc: ^9.1.1
  image_picker: ^1.2.2
  intl: any
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
