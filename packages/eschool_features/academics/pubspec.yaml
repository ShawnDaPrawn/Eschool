name: eschool_academics
description: Shared NavigateEd academic capture, registers, timetables and released results.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  eschool_api:
    path: ../../eschool_api
  eschool_core:
    path: ../../eschool_core
  eschool_session:
    path: ../../eschool_session
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  hive: ^2.2.3
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  uuid: ^4.6.0
  dio: ^5.9.2
  crypto: ^3.0.7
  file_picker: 13.1.0
  flutter_markdown_plus: 1.0.12
  url_launcher: ^6.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
