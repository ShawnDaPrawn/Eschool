name: eschool_notifications
description: Push and local notifications for both NavigateEd apps.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  awesome_notifications: ^0.12.1
  equatable: ^3.0.0
  eschool_api:
    path: ../eschool_api
  eschool_core:
    path: ../eschool_core
  eschool_session:
    path: ../eschool_session
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_bloc: ^9.1.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  dio: ^5.9.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
