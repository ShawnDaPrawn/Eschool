ServerName localhost

# Don't advertise the Apache, OS and module versions in headers and error
# pages, and refuse TRACE. This file is included after the image's
# conf-enabled/security.conf, so these win.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
