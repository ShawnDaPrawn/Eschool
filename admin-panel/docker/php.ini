memory_limit=256M
upload_max_filesize=32M
post_max_size=32M
max_execution_time=120
expose_php=0
; Errors go to the log (Apache's error log, which is stderr), never into a page.
display_errors=Off
display_startup_errors=Off
log_errors=On
; Exception traces never include function arguments (a password, a name).
zend.exception_ignore_args=On
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
