# CORS for the uploaded files under /storage (pictures and PDFs).
#
# Apache serves these files itself, outside Laravel and its CORS middleware
# (config/cors.php), so the web portals' requests for them (CanvasKit draws
# pictures from fetched bytes; the PDF viewer downloads the file) were blocked
# by the browser (self-test defect D2). This answers the same origins as
# config/cors.php: the entrypoint exports STORAGE_CORS_ORIGINS, a regular
# expression built from them by docker/storage-cors-origins.php, and the
# Dockerfile's default matches nothing.
#
# Only GET and HEAD from an allowed origin get Access-Control-Allow-Origin
# (that origin, never "*", and no credentials); every answer under /storage
# varies by Origin so a cache never hands one origin's answer to another.
<IfModule mod_headers.c>
    <LocationMatch "^/storage/">
        SetEnvIf Origin "${STORAGE_CORS_ORIGINS}" STORAGE_CORS_ORIGIN=$0
        SetEnvIf Request_Method "^(?!(GET|HEAD)$)" !STORAGE_CORS_ORIGIN
        Header always set Access-Control-Allow-Origin "%{STORAGE_CORS_ORIGIN}e" env=STORAGE_CORS_ORIGIN
        Header always merge Vary "Origin"
    </LocationMatch>
</IfModule>
