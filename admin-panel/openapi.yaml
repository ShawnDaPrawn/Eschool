openapi: 3.1.0
info:
  title: NavigateEd API v2
  version: 2.0.0
  summary: The contract for every /api/v2 endpoint.
  description: |
    API v2 is served by the admin panel's Laravel app under `/api/v2`, next to
    v1 (`/api`), which keeps serving the installed apps unchanged. This file is
    the contract: `tests/Feature/Contracts` validates every v2 response against
    it and fails on a v2 route it does not describe, CI lints it, and
    `packages/eschool_api` (the apps' Dart client) is generated from it.

    Change it in the same pull request as the endpoint. Fields and endpoints
    are only ever added: nothing is renamed or removed while an app version in
    use still reads it.

    ## Envelope

    Every answer is a JSON object `{error, message, data, code}`, as in v1:
    `error` is `false` on success and `true` on failure, `message` is a
    sentence the app may show, `data` is the payload (or `null`) and `code` is
    `200` on success and a string error code (below) on failure. Unlike v1, v2
    also uses real HTTP statuses: 2xx on success, 4xx or 5xx with
    `error: true`. A failure may carry `details` (exception text, only when
    the server runs in debug mode).

    ## Error codes

    | HTTP | `code` | When |
    | --- | --- | --- |
    | 400 | `bad_request` | The request could not be read |
    | 400 | `idempotency_key_missing` | A write that needs an `Idempotency-Key` came without one |
    | 400 | `idempotency_key_invalid` | The `Idempotency-Key` is not 1 to 255 visible ASCII characters |
    | 401 | `unauthenticated` | No token, or an expired or revoked one: sign the user out |
    | 403 | `forbidden` | Signed in, but this profile may not do this |
    | 404 | `not_found` | No such endpoint or record (also for another school's record) |
    | 405 | `method_not_allowed` | Wrong HTTP method |
    | 409 | `idempotency_key_in_progress` | The first request with this key is still running; retry shortly |
    | 409 | `conflict` | A concurrent change got there first |
    | 413 | `payload_too_large` | The body is too large |
    | 419 | `session_expired` | Web portals: the CSRF token expired |
    | 422 | `validation_failed` | Invalid input; `data.errors` lists every message by field, `message` is the first |
    | 422 | `idempotency_key_reused` | This key was already used for a different request |
    | 429 | `too_many_requests` | Over a rate limit; wait `Retry-After` seconds |
    | 500 | `server_error` | A bug on our side; the request may be retried |
    | 503 | `unavailable` | Maintenance or overload |

    Any other status comes with `http_error`. Clients must accept codes they do
    not know (treat them by HTTP status).

    ## Authentication

    The apps send a Sanctum personal access token (`Authorization: Bearer
    <id>|<token>`), issued by the v1 sign-in endpoints. The web portals sign in
    with Sanctum cookies instead: `GET /sanctum/csrf-cookie`, then the session
    cookie plus an `X-XSRF-TOKEN` header. Every v2 route sits in a role group
    (Student, Parent, Teacher, staff, or every profile); another profile gets
    403.

    ## Rate limits

    | Limiter | Limit | Applies to |
    | --- | --- | --- |
    | `api` | 60 a minute per user (per address when signed out) | every route |
    | `auth` | 5 a minute per account and 20 per address | sign-in, one-time codes, password resets |
    | `money` | 30 a minute per token | money writes |

    Answers carry `X-RateLimit-Limit` and `X-RateLimit-Remaining`; a 429 adds
    `Retry-After` (seconds).

    ## Lists

    List endpoints take the same parameters everywhere (see
    `components/parameters`): `page` (from 1), `per_page` (1 to 100),
    `sort` (comma-separated fields, `-` for descending), `filter[<field>]`
    and `q` (free-text search). They answer `data: {items: [...],
    pagination: Pagination}`.

    ## Idempotency

    Writes accept an `Idempotency-Key` header (any unique string, a UUID is
    best). A retry with the same key and the same request gets the first
    answer again, with `Idempotent-Replayed: true`, and the work runs once.
    The same key with a different request is refused (422
    `idempotency_key_reused`). Keys are per user and kept 24 hours. Money
    writes require one.
  contact:
    name: NavigateEd engineering
servers:
  - url: /api/v2
    description: The admin panel's host (for example https://admin.navigateed.co.za/api/v2)
security:
  - bearerAuth: []
  - cookieAuth: []
