  /academics/teaching-groups:
    get:
      operationId: getTeachingGroups
      tags:
      - Academics
      summary: getTeachingGroups
      description: Academic structure management requires explicit school permission. Teachers read only
        allocated groups. Kind memberships requires learner_id and mark_rule; teachers requires teacher_id;
        homerooms requires teacher_id, class_section_id and session_year_id; leadership requires user_id,
        session_year_id and kind, with grade_level_id required for grade heads and omitted or null for
        principals. Date intervals stay within the year. Updates require revision and all context fields;
        history is audited. Weights and marks are not changed by an allocation.
      parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
      - $ref: '#/components/parameters/SchoolId'
      - name: session_year_id
        in: query
        schema:
          type: integer
          minimum: 1
      - name: subject_id
        in: query
        schema:
          type: integer
          minimum: 1
      - name: grade_level_id
        in: query
        schema:
          type: integer
          minimum: 1
      - name: 'on'
        in: query
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: School-scoped academic allocation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingGroupsResponse'
        '400':
          $ref: '#/components/responses/IdempotencyKeyProblem'
        '401':
