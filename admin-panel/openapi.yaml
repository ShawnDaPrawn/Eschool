components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Sanctum personal access token, `<id>|<token>`, from an app's sign-in.
    cookieAuth:
      type: apiKey
      in: cookie
      name: e_school_session
      description: |
        The web portals' Sanctum session cookie (named by SESSION_COOKIE;
        `e_school_session` by default), with the `X-XSRF-TOKEN` header from
        `GET /sanctum/csrf-cookie` on writes.
  parameters:
    SchoolId:
      name: X-School-Id
      in: header
      required: false
      description: |
        The school to work in, one of the signed-in user's schools (`schools`
        in `/me/context`). Without it the request works in the user's first
        school. A school the user is not an active member of is refused with
        403. Apps send it on every call once a school is chosen.
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      description: The page of a list, from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: Comma-separated fields to sort by; a leading `-` sorts that field descending, for example `-created_at,name`.
      schema:
        type: string
        pattern: '^-?[a-z_]+(,-?[a-z_]+)*$'
    Filter:
      name: filter
      in: query
      description: 'Filters by field, for example `filter[status]=active&filter[class_id]=3`. Each list says which fields it filters on.'
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string
    Q:
      name: q
      in: query
      description: Free-text search over the list's main text fields.
      schema:
        type: string
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Makes a write safe to retry. Any unique string of 1 to 255 visible ASCII characters (a UUID is best), kept 24 hours per user. Required on money writes.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x21-\x7E]+$'
  headers:
    X-RateLimit-Limit:
      description: Requests allowed in the current minute.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests left in the current minute.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before trying again.
      schema:
        type: integer
    Idempotent-Replayed:
      description: '`true` when this is the stored answer to an earlier request with the same Idempotency-Key.'
      schema:
        type: string
  responses:
    Unauthenticated:
      description: No valid token or session. The app signs the user out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: This profile may not use this endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No such endpoint or record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Invalid input, or an Idempotency-Key reused for a different request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyKeyProblem:
      description: A write that needs an Idempotency-Key came without a valid one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyKeyInProgress:
      description: The first request with this Idempotency-Key is still running.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Over a rate limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: A bug on our side.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    MySchoolResponse:
      type: object
      additionalProperties: false
      required: [error, message, data, code]
      properties:
        error:
          type: boolean
          description: Always false.
        message:
          type: string
        data:
          $ref: '#/components/schemas/MySchoolInfo'
        code:
          type: integer
          description: Always 200.
    MySchoolInfo:
      type: object
      additionalProperties: false
      required: [website, phone, email, address, documents, term_dates]
      properties:
        school:
          $ref: '#/components/schemas/SchoolSummary'
        website:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        email:
          type: [string, 'null']
        address:
          type: [string, 'null']
        documents:
          type: array
          items:
            $ref: '#/components/schemas/SchoolDocument'
        term_dates:
          type: array
          items:
            $ref: '#/components/schemas/TermDates'
    SchoolDocument:
      type: object
      additionalProperties: false
      required: [title, kind, url]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        kind:
          type: [string, 'null']
        url:
          type: string
          format: uri
    TermDates:
      type: object
      additionalProperties: false
      required: [name, starts_on, ends_on]
      properties:
        name:
          type: string
        starts_on:
          type: [string, 'null']
          format: date
        ends_on:
          type: [string, 'null']
          format: date
    ErrorCode:
      type: string
      description: What went wrong (see the table in the description). Clients must accept codes they do not know.
      enum:
        - bad_request
        - unauthenticated
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - payload_too_large
        - session_expired
        - validation_failed
        - too_many_requests
        - server_error
        - unavailable
        - http_error
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reused
        - idempotency_key_in_progress
    ErrorResponse:
      type: object
      description: The envelope of every failure.
      additionalProperties: false
      required: [error, message, data, code]
      properties:
        error:
          type: boolean
          description: Always true.
        message:
          type: string
          description: A sentence the app may show (for validation, the first message).
        data:
          description: Every validation message by field, for `validation_failed`; otherwise null.
          oneOf:
            - $ref: '#/components/schemas/ValidationErrors'
            - type: 'null'
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          type: string
          description: Exception text, only when the server runs in debug mode.
    ValidationErrors:
      type: object
      additionalProperties: false
      required: [errors]
      properties:
        errors:
          type: object
          description: Messages by field name (nested fields use dots, for example `items.0.amount`).
          additionalProperties:
            type: array
            items:
              type: string
    Pagination:
      type: object
      description: 'Where a page sits in a list. List endpoints answer `data: {items, pagination}`.'
      additionalProperties: false
      required: [page, per_page, total, last_page]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
    ContextResponse:
      type: object
      additionalProperties: false
      required: [error, message, data, code]
      properties:
        error:
          type: boolean
          description: Always false.
        message:
          type: string
        data:
          $ref: '#/components/schemas/Context'
        code:
          type: integer
          description: Always 200.
    ApprovalState:
      type: object
      additionalProperties: false
      required:
      - status
      - approved_by_count
      properties:
        status:
          type: string
          enum:
          - pending
          - approved
          - withdrawn
        approved_by_count:
          type: integer
          minimum: 0
    ApprovalLearner:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - image
      - student_number
      - school
      properties:
        id:
          type: integer
        name:
          type: string
        image:
          type:
          - string
          - 'null'
        student_number:
          type:
          - string
          - 'null'
        school:
          $ref: '#/components/schemas/SchoolSummary'
    GuardianConsent:
      type: object
      additionalProperties: false
      required:
      - version
      - text
      properties:
        version:
          type: string
        text:
          type: string
    GuardianApproval:
      type: object
      additionalProperties: false
      required:
      - learner
      - status
      - requested_at
      - consent
      properties:
        learner:
          $ref: '#/components/schemas/ApprovalLearner'
        status:
          type: string
          enum:
          - pending
          - approved
          - withdrawn
        requested_at:
          type:
          - string
          - 'null'
          format: date-time
        consent:
          $ref: '#/components/schemas/GuardianConsent'
    GuardianApprovalsResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
          description: Always false.
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/GuardianApproval'
        code:
          type: integer
          description: Always 200.
    ApprovalStateResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
          description: Always false.
        message:
          type: string
        data:
          $ref: '#/components/schemas/ApprovalState'
        code:
          type: integer
          description: Always 200.
    GuardianInvitationPreview:
      type: object
      additionalProperties: false
      required:
      - school
      - email
      - learners
      - expires_at
      - needs_password
      properties:
        school:
          $ref: '#/components/schemas/SchoolSummary'
        email:
          type: string
          format: email
        learners:
          type: array
          items:
            type: object
            required:
            - id
            - name
            additionalProperties: false
            properties:
              id:
                type: integer
              name:
                type: string
        expires_at:
          type: string
          format: date-time
        needs_password:
          type: boolean
    GuardianInvitationIssued:
      type: object
      additionalProperties: false
      required:
      - id
      - expires_at
      properties:
        id:
          type: integer
        expires_at:
          type: string
          format: date-time
    GuardianInvitationPreviewResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/GuardianInvitationPreview'
        code:
          type: integer
    GuardianInvitationIssuedResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/GuardianInvitationIssued'
