        - unauthenticated
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - payload_too_large
        - session_expired
        - validation_failed
        - too_many_requests
        - server_error
        - unavailable
        - http_error
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reused
