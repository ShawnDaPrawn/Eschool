  /me/context:
    get:
      operationId: getMeContext
      tags:
      - Platform
      summary: The signed-in user, their schools and the current school
      description: 'What an app needs to set itself up: the user and their roles, the

        schools they belong to, the current school (branding, timezone, year

        and terms), which modules it has on, its notification rules and

        feature flags, the sign-in methods it offers and, for a parent, each

        child with that child''s school. Apps fetch it at start-up, after

        signing in and when the user changes school, and keep a cached copy. Every profile may call it.
        Budget: 150 ms at p95.


        The answer is for the school the request works in: the one

        `X-School-Id` names (one of the user''s `schools`), or else the

        user''s first school. `user.roles` are the roles there; each entry

        of `schools` lists the user''s roles at that school. The answer is

        composed by contributor classes (`config/context.php`); a key or

        field is only ever added.

        '
      parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: The context.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
