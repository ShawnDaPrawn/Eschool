components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Sanctum personal access token, `<id>|<token>`, from an app's sign-in.
    cookieAuth:
      type: apiKey
      in: cookie
      name: e_school_session
      description: 'The web portals'' Sanctum session cookie (named by SESSION_COOKIE;

        `e_school_session` by default), with the `X-XSRF-TOKEN` header from

        `GET /sanctum/csrf-cookie` on writes.

        '
  parameters:
    ExpectedAccount:
      name: X-Account-Id
      in: header
      required: false
      description: Expected authenticated account for a pinned private view. A mismatch is refused before school data is read or an operation is replayed. This header never grants authority. Older clients may omit it.
      schema:
        type: integer
        minimum: 1
    SchoolId:
      name: X-School-Id
      in: header
      required: false
      description: 'The school to work in, one of the signed-in user''s schools (`schools`

        in `/me/context`). Without it the request works in the user''s first

        school. A school the user is not an active member of is refused with

        403. Apps send it on every call once a school is chosen.

        '
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      description: The page of a list, from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: Comma-separated fields to sort by; a leading `-` sorts that field descending, for example
        `-created_at,name`.
      schema:
        type: string
        pattern: ^-?[a-z_]+(,-?[a-z_]+)*$
    Filter:
      name: filter
      in: query
      description: Filters by field, for example `filter[status]=active&filter[class_id]=3`. Each list
        says which fields it filters on.
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string
    Q:
      name: q
      in: query
      description: Free-text search over the list's main text fields.
      schema:
        type: string
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Makes a write safe to retry. Any unique string of 1 to 255 visible ASCII characters
        (a UUID is best), kept 24 hours per user. Required on money writes.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
    ActivityGroupsCapability:
      name: activity_groups
      in: query
      description: Set 1 only for a client that can render and round-trip activity-group audience kinds. Default 0 preserves
        legacy compose scopes and excludes activity drafts. Published inbox/read payloads are unchanged. This flag grants
        no group authority.
      schema:
        type: integer
        minimum: 0
        maximum: 1
        default: 0
  headers:
    X-RateLimit-Limit:
      description: Requests allowed in the current minute.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests left in the current minute.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before trying again.
      schema:
        type: integer
    Idempotent-Replayed:
      description: '`true` when this is the stored answer to an earlier request with the same Idempotency-Key.'
      schema:
        type: string
  responses:
    Unauthenticated:
      description: No valid token or session. The app signs the user out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: This profile may not use this endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No such endpoint or record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Invalid input, or an Idempotency-Key reused for a different request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyKeyProblem:
      description: A write that needs an Idempotency-Key came without a valid one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyKeyInProgress:
      description: The first request with this Idempotency-Key is still running.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Over a rate limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: A bug on our side.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
