openapi: 3.1.0
info:
  title: NavigateEd API v2
  version: 2.0.0
  summary: The contract for every /api/v2 endpoint.
  description: |
    API v2 is served by the admin panel's Laravel app under `/api/v2`, next to
    v1 (`/api`), which keeps serving the installed apps unchanged. This file is
    the contract: `tests/Feature/Contracts` validates every v2 response against
    it and fails on a v2 route it does not describe, CI lints it, and
    `packages/eschool_api` (the apps' Dart client) is generated from it.

    Change it in the same pull request as the endpoint. Fields and endpoints
    are only ever added: nothing is renamed or removed while an app version in
    use still reads it.

    ## Envelope

    Every answer is a JSON object `{error, message, data, code}`, as in v1:
    `error` is `false` on success and `true` on failure, `message` is a
    sentence the app may show, `data` is the payload (or `null`) and `code` is
    `200` on success and a string error code (below) on failure. Unlike v1, v2
    also uses real HTTP statuses: 2xx on success, 4xx or 5xx with
    `error: true`. A failure may carry `details` (exception text, only when
    the server runs in debug mode).

    ## Error codes

    | HTTP | `code` | When |
    | --- | --- | --- |
    | 400 | `bad_request` | The request could not be read |
    | 400 | `idempotency_key_missing` | A write that needs an `Idempotency-Key` came without one |
    | 400 | `idempotency_key_invalid` | The `Idempotency-Key` is not 1 to 255 visible ASCII characters |
    | 401 | `unauthenticated` | No token, or an expired or revoked one: sign the user out |
    | 403 | `forbidden` | Signed in, but this profile may not do this |
    | 404 | `not_found` | No such endpoint or record (also for another school's record) |
    | 405 | `method_not_allowed` | Wrong HTTP method |
    | 409 | `idempotency_key_in_progress` | The first request with this key is still running; retry shortly |
    | 409 | `conflict` | A concurrent change got there first |
    | 413 | `payload_too_large` | The body is too large |
    | 419 | `session_expired` | Web portals: the CSRF token expired |
    | 422 | `validation_failed` | Invalid input; `data.errors` lists every message by field, `message` is the first |
    | 422 | `idempotency_key_reused` | This key was already used for a different request |
    | 429 | `too_many_requests` | Over a rate limit; wait `Retry-After` seconds |
    | 500 | `server_error` | A bug on our side; the request may be retried |
    | 503 | `unavailable` | Maintenance or overload |

    Any other status comes with `http_error`. Clients must accept codes they do
    not know (treat them by HTTP status).

    ## Authentication

    The apps send a Sanctum personal access token (`Authorization: Bearer
    <id>|<token>`), issued by the v1 sign-in endpoints. The web portals sign in
    with Sanctum cookies instead: `GET /sanctum/csrf-cookie`, then the session
    cookie plus an `X-XSRF-TOKEN` header. Every v2 route sits in a role group
    (Student, Parent, Teacher, staff, or every profile); another profile gets
    403.

    ## Rate limits

    | Limiter | Limit | Applies to |
    | --- | --- | --- |
    | `api` | 60 a minute per user (per address when signed out) | every route |
    | `auth` | 5 a minute per account and 20 per address | sign-in, one-time codes, password resets |
    | `money` | 30 a minute per token | money writes |

    Answers carry `X-RateLimit-Limit` and `X-RateLimit-Remaining`; a 429 adds
    `Retry-After` (seconds).

    ## Lists

    List endpoints take the same parameters everywhere (see
    `components/parameters`): `page` (from 1), `per_page` (1 to 100),
    `sort` (comma-separated fields, `-` for descending), `filter[<field>]`
    and `q` (free-text search). They answer `data: {items: [...],
    pagination: Pagination}`.

    ## Idempotency

    Writes accept an `Idempotency-Key` header (any unique string, a UUID is
    best). A retry with the same key and the same request gets the first
    answer again, with `Idempotent-Replayed: true`, and the work runs once.
    The same key with a different request is refused (422
    `idempotency_key_reused`). Keys are per user and kept 24 hours. Money
    writes require one.
  contact:
    name: NavigateEd engineering
servers:
  - url: /api/v2
    description: The admin panel's host (for example https://admin.navigateed.co.za/api/v2)
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Platform
    description: Who is signed in and the school they work in.
paths:
  /me/profile/fields/{field}/file:
    post:
      operationId: uploadMyProfileFile
      tags: [Platform]
      summary: Upload a private attachment to an editable profile field
      description: PDF, PNG or JPEG up to 5 MB. The upload is encrypted and returns no private metadata; refresh the profile to read permitted metadata.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: field
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [profile_type, document]
              properties:
                profile_type:
                  type: string
                document:
                  type: string
                  format: binary
      responses:
        '200':
          description: The encrypted attachment was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSavedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /people/{person}/profile/fields/{field}/file:
    post:
      operationId: uploadPersonProfileFile
      tags: [Platform]
      summary: Upload a private attachment to an editable profile field
      description: PDF, PNG or JPEG up to 5 MB. The upload is encrypted and returns no private metadata; refresh the profile to read permitted metadata.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: person
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: field
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [profile_type, document]
              properties:
                profile_type:
                  type: string
                document:
                  type: string
                  format: binary
      responses:
        '200':
          description: The encrypted attachment was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSavedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /schools/{school}/my-school:
    get:
      operationId: getMySchool
      tags: [Platform]
      summary: Published contacts, documents and current term dates for a school
      description: Requires active membership and the same school in X-School-Id. Document links are public school publications, not private person files.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: school
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: The school's published information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySchoolResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /me/context:
    get:
      operationId: getMeContext
      tags: [Platform]
      summary: The signed-in user, their schools and the current school
      description: |
        What an app needs to set itself up: the user and their roles, the
        schools they belong to, the current school (branding, timezone, year
        and terms), which modules it has on, its notification rules and
        feature flags, the sign-in methods it offers and, for a parent, each
        child with that child's school. Apps fetch it at start-up, after
        signing in and when the user changes school, and keep a cached copy. Every profile may call it. Budget: 150 ms at p95.

        The answer is for the school the request works in: the one
        `X-School-Id` names (one of the user's `schools`), or else the
        user's first school. `user.roles` are the roles there; each entry
        of `schools` lists the user's roles at that school. The answer is
        composed by contributor classes (`config/context.php`); a key or
        field is only ever added.
      parameters:
        - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: The context.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /guardian/approvals:
    get:
      operationId: getGuardianApprovals
      tags:
      - Platform
      summary: List linked learners and current consent
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianApprovalsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /guardian/approvals/{learner}:
    post:
      operationId: decideGuardianApproval
      tags:
      - Platform
      summary: Approve or withdraw learner access
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: learner
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              - consent_version
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - withdraw
                consent_version:
                  type: string
                  maxLength: 32
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalStateResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /guardian/invitations/{token}:
    get:
      operationId: getGuardianInvitation
      tags:
      - Platform
      summary: Read a private guardian invitation
      security: []
      parameters:
      - &id001
        name: token
        in: path
        required: true
        schema:
          type: string
        description: Private one-use invitation token from the emailed link.
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianInvitationPreviewResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /guardian/invitations/{token}/accept:
    post:
      operationId: acceptGuardianInvitation
      tags:
      - Platform
      summary: Verify the invited mailbox and sign in once
      security: []
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 10
                device_type:
                  type: string
                  enum:
                  - android
                  - ios
                  - web
                fcm_id:
                  type: string
                  maxLength: 4096
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianInvitationAcceptedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /guardians/{guardian}/invitations:
    post:
      operationId: issueGuardianInvitation
      tags:
      - Platform
      summary: Email an invitation to an existing linked guardian
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: guardian
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianInvitationIssuedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /staff/learners/{learner}/enrolments:
    get:
      operationId: getLearnerEnrolments
      tags:
      - Platform
      summary: Read a learners dated enrolment history
      parameters:
      - &id001
        $ref: '#/components/parameters/SchoolId'
      - &id002
        name: learner
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: date
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createLearnerEnrolment
      tags:
      - Platform
      summary: Append a dated homeroom assignment
      parameters:
      - *id001
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - class_section_id
              - session_year_id
              - starts_on
              - reason
              properties:
                class_section_id:
                  type: integer
                session_year_id:
                  type: integer
                starts_on:
                  type: string
                  format: date
                reason:
                  type: string
                  minLength: 3
                  maxLength: 255
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /me/handle:
    get:
      operationId: getMyHandle
      tags:
      - Platform
      summary: Read your handle and pending proposal
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleStateResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '410':
          description: The proposal has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: setMyHandle
      tags:
      - Platform
      summary: Choose a handle or request guardian approval
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleStateResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '410':
          description: The proposal has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - handle
              properties:
                handle:
                  type: string
                  minLength: 3
                  maxLength: 20
  /guardian/handle-proposals:
    get:
      operationId: getGuardianHandleProposals
      tags:
      - Platform
      summary: Read your linked learners pending handle requests
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianHandleProposalsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '410':
          description: The proposal has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /guardian/handle-proposals/{proposal}:
    post:
      operationId: decideGuardianHandleProposal
      tags:
      - Platform
      summary: Approve or reject a linked learners handle
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: proposal
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandleStateResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '410':
          description: The proposal has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - reject
  /me/notification-preferences:
    get:
      operationId: getMyNotificationPreferences
      tags:
      - Platform
      summary: Read your notice preferences and required channels
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: updateMyNotificationPreferences
      tags:
      - Platform
      summary: Change an optional notification channel
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - type
              - channel
              - enabled
              properties:
                type:
                  type: string
                channel:
                  type: string
                  enum:
                  - push
                  - email
                  - in_app
                enabled:
                  type: boolean
  /me/profile:
    get:
      operationId: getMyProfile
      tags:
      - Platform
      summary: Read your authorised profile form
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: profile_type
        in: query
        required: false
        description: The person profile at the current school; defaults to the first
          active profile.
        schema:
          type: string
      responses:
        '200':
          description: The operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileFormResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInProgress'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: updateMyProfile
      tags:
      - Platform
      summary: Save your editable profile fields
      parameters:
