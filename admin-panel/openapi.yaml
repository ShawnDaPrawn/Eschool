    ContextUser:
      type: object
      additionalProperties: false
      required: [id, first_name, last_name, name, email, image, roles]
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        name:
          type: string
          description: First and last name.
        email:
          type: string
          description: The sign-in name; a learner's is their GR number.
        image:
          type: [string, 'null']
          description: The profile picture's URL, or null.
        handle:
          type: [string, 'null']
          description: Your platform handle, when chosen and approved.
        roles:
          type: array
          description: The user's role names at the current school, for example `Parent`, `Teacher`, `Super Admin` or a role the school created.
          items:
            type: string
    SchoolSummary:
      type: object
      additionalProperties: false
      required: [id, name, short_name, crest_url]
      properties:
        id:
          type: integer
        name:
          type: string
        short_name:
          type: [string, 'null']
        crest_url:
          type: [string, 'null']
          description: The school's crest or logo, shown beside the NavigateEd brand; null when none is uploaded.
    SchoolMembership:
      type: object
      additionalProperties: false
      required: [school, roles]
      properties:
        school:
          $ref: '#/components/schemas/SchoolSummary'
        roles:
          type: array
          items:
            type: string
    CurrentSchool:
      type: object
      additionalProperties: false
      required: [id, name, short_name, crest_url, tagline, branding, timezone, session_year]
      properties:
        id:
          type: integer
        name:
          type: string
        short_name:
          type: [string, 'null']
        crest_url:
          type: [string, 'null']
        tagline:
          type: [string, 'null']
        branding:
          $ref: '#/components/schemas/Branding'
        timezone:
          type: string
          description: IANA timezone the school's dates and times are shown in, for example `Africa/Johannesburg`.
        session_year:
          description: The current school year, or null when none is set.
          oneOf:
            - $ref: '#/components/schemas/SessionYear'
            - type: 'null'
    Branding:
      type: object
      description: The school's colours as the school stored them (usually `#RRGGBB`). Shown only on the crest and the school's own page, never in place of the NavigateEd theme.
      additionalProperties: false
      required: [theme_color, secondary_color]
      properties:
        theme_color:
          type: [string, 'null']
        secondary_color:
          type: [string, 'null']
    SessionYear:
      type: object
      additionalProperties: false
      required: [id, name, start_date, end_date, terms]
      properties:
        id:
          type: integer
        name:
          type: string
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
        terms:
          type: array
          items:
            $ref: '#/components/schemas/Term'
    Term:
      type: object
      additionalProperties: false
      required: [id, name, start_date, end_date, current]
      properties:
        id:
          type: integer
        name:
          type: string
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
        current:
          type: boolean
          description: Whether today, in the school's timezone, falls in this term.
    Module:
      type: object
      description: A module switched on at the school (Phase 1).
      additionalProperties: false
      required: [key, read_only]
      properties:
        key:
          type: string
          description: The module's key in config/modules.php, for example `fees`.
        read_only:
          type: boolean
          description: True when the module was switched off with data left in it, so it can be seen but not changed.
    NotificationRule:
      type: object
      description: How the school sends one notification type to this profile (Phase 1).
      additionalProperties: false
      required: [type, channel, mode]
      properties:
        type:
          type: string
          description: The notification type's key, for example `fees.invoice`.
        channel:
          type: string
          description: '`push`, `email` or `in_app`.'
        mode:
          type: string
          description: '`mandatory`, `default_on`, `default_off` or `off`.'
    Child:
      type: object
      additionalProperties: false
      required: [id, user_id, first_name, last_name, name, image, school]
      properties:
        id:
          type: integer
          description: The learner's id (the `child_id` the v1 parent endpoints take).
        user_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        name:
          type: string
        image:
          type: [string, 'null']
        student_number:
          type:
          - string
          - 'null'
        approved:
          type: boolean
        homeroom:
          type:
          - string
          - 'null'
        school:
          $ref: '#/components/schemas/SchoolSummary'
