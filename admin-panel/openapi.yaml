      type: string
      description: What went wrong (see the table in the description). Clients must accept codes they
        do not know.
      enum:
      - bad_request
      - unauthenticated
      - forbidden
      - not_found
      - method_not_allowed
      - conflict
      - payload_too_large
      - session_expired
      - validation_failed
      - too_many_requests
      - server_error
      - unavailable
      - http_error
      - idempotency_key_missing
      - idempotency_key_invalid
      - idempotency_key_reused
      - idempotency_key_in_progress
    ErrorResponse:
      type: object
      description: The envelope of every failure.
      additionalProperties: false
      required:
      - error
      - message
      - data
      - code
      properties:
        error:
          type: boolean
          description: Always true.
        message:
          type: string
          description: A sentence the app may show (for validation, the first message).
        data:
          description: Every validation message by field, for `validation_failed`; otherwise null.
          oneOf:
          - $ref: '#/components/schemas/ValidationErrors'
          - type: 'null'
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          type: string
          description: Exception text, only when the server runs in debug mode.
    ValidationErrors:
      type: object
      additionalProperties: false
      required:
      - errors
      properties:
        errors:
          type: object
          description: Messages by field name (nested fields use dots, for example `items.0.amount`).
          additionalProperties:
