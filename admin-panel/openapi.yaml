  /academics/marks/groups/{group}:
    get:
      operationId: getMarkMatrix
      tags:
      - Academics
      summary: getMarkMatrix
      description: Fresh current school authority is checked before idempotent replay.
        Scores are exact decimal strings with up to two decimal places. Percentages
        are integer basis points; incomplete results remain provisional. Corrections
        require expected_revision; locked terms return 409. Active task IDs map to a
        year-specific canonical task; copied definitions never duplicate marks. No fee
        condition gates academic results.
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: group
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: term_id
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: School-scoped academic result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicMatrixResponse'
        '400':
          $ref: '#/components/responses/IdempotencyKeyProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
