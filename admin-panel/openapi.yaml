    Context:
      type: object
      additionalProperties: false
      required: [user, schools, current_school, modules, notification_rules, feature_flags, sign_in_methods, children]
      properties:
        user:
          $ref: '#/components/schemas/ContextUser'
        schools:
          type: array
          description: Every school the user is an active member of, with their roles there, in school order. An app offers a school switcher when there is more than one and sends the chosen school's `id` as `X-School-Id`.
          items:
            $ref: '#/components/schemas/SchoolMembership'
        current_school:
          $ref: '#/components/schemas/CurrentSchool'
        modules:
          type: array
          description: Modules switched on at the current school (empty until Phase 1).
          items:
            $ref: '#/components/schemas/Module'
        notification_rules:
          type: array
          description: The current school's notification rules for this profile (empty until Phase 1).
          items:
            $ref: '#/components/schemas/NotificationRule'
        profile_fields:
          type: array
          description: School-specific metadata for the user's profiles; never contains person values. Missing on older servers.
          items:
            $ref: '#/components/schemas/ProfileFieldSummary'
        feature_flags:
          type: object
          description: Feature switches by key (empty until Phase 1).
          additionalProperties:
            type: boolean
        sign_in_methods:
          type: array
          description: How this user may sign in at the current school, for example `password` (passkeys, Google, Microsoft and email links arrive in Phase 1).
          items:
            type: string
        children:
          type: array
          description: A parent's children (as father, mother or guardian); empty for everyone else.
          items:
            $ref: '#/components/schemas/Child'
        approval:
          description: Guardian access approval for a learner; null for other profiles.
          oneOf:
          - $ref: '#/components/schemas/ApprovalState'
          - type: 'null'
